# Performance and memory budgets that only tighten (docs/PERFORMANCE.md,
# "Budgets"; scripts/budgets.py).
#
# Each budget is a fixed number every push is measured against -- never the
# previous run -- so small regressions add up against one number instead of
# each passing against the last.
#
# - A measurement over its budget by more than the kind's tolerance fails.
#   Find what made it slower or larger. If that is the price of a change
#   worth having, raise the budget, with a [[raised]] entry at the end of
#   this file (the key, the old and new number, the date, the reason) and a
#   CHANGELOG *Performance* entry the entry quotes; `scripts/budgets.py
#   raises` holds every increase in this file's git history to both. A
#   wider tolerance is a raise too.
# - A measurement under its budget by more than the tolerance fails as
#   well, naming the number to tighten the budget to, so the change that
#   made the gain is the one that keeps it (`scripts/budgets.py apply`
#   writes it). A measuring run reports and never fails.
# - A case with no budget yet is reported with its measurement and fails
#   nothing: that is how a new case, or the first budgets, are set.
#
# The drift since the last release is read from that release, not from this
# file: a release attaches its own measurements, every kind, to its GitHub
# release as `budgets-baseline.json`, and every later run reads the newest
# release's copy and reports each case's drift since. A release needs a
# [[signoff]] for any case past `drift_signoff` either way.

[meta]
# An instruction count belongs to the code *and* to the compiler that built
# it, the image it ran on and the harness that counted it, so all three are
# pinned. Changing one re-measures every case: a raise or a tightening like
# any other, in the same change.
toolchain = "1.99.1"
runner = "ubuntu-24.04"
gungraun = "0.20.0"
# The rows each instruction case counts (`ROWS` in crates/online-bench).
rows = 1000
drift_signoff = 0.10

[meta.tolerance]
# Shares of the budget. Instruction counts do not depend on the machine's
# load, and two runs of one binary agree to within a quarter of this or the
# job fails (`check` with a second run). What 2% has to absorb is the
# inlining an unrelated change moves.
instructions = 0.02
# `estimated_size()` of the same rows through the same code is the same
# number of bytes on every platform; 2% is a few bytes a row of rounding in
# Arrow's buffers.
memory = 0.02
# Peak resident memory moves with the allocator's arenas and the page cache.
# Two runs of one build on CI's macOS runner at the floor Python, hours
# apart, read 236.7 and 193.4 MiB for the streaming case and 192.5 and 165.5
# for ten-target ewridge (2026-10-12/13): 14-18% apart, so 15% failed one
# of them either way. 30% still catches what this budget is for, the dense
# `coef` that added 3.9 GiB at 1M rows. A run under its budget by more than
# a quarter of this, 7.5%, tightens it (`TIGHTEN_SHARE` in
# scripts/budgets.py): tightened only past the whole 30%, a later run could
# pass 86% above the run that set the budget; past 7.5%, 41%.
rss = 0.30

