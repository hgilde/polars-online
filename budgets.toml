# --- scaling ---------------------------------------------------------------------
# How a cost grows, not what it is (docs/PERFORMANCE.md, "How cost grows";
# crates/online-bench/src/scaling.rs). Each cell is counted at two sizes of one
# dimension, `small` and `large` (the `scale_*` cases), and the ratio of the two
# counts, within one run, is held to the growth the algorithm declares:
# count(large) / count(small) <= g(large) / g(small) * (1 + tolerance). No
# number from an earlier run is read, so a cost that grew the wrong way from
# the first day fails on the first run. `growth` is "1", "log n", "n" or
# "n^e". The cells mirror online-bench's own declarations
# (`tests/scaling.rs` holds the two to each other).
[scaling]
# A count is the code's alone, the same each run to well inside this, and a
# declared growth bounds the honest ratio from above: a fixed cost per row
# only lowers it. What 10% has to absorb is the one place a count may read
# a constant above 1, a held structure larger at the large size (a hash
# table's probes, a heap's depth), which the native measurement of every
# such cell put at 1.00x to 1.03x in allocations. A growth one power past the
# declared reads the step, 8x.
tolerance = 0.10

[scaling.cells."ewridge.k"]
what = "ewridge's row with no solve due, 4 then 32 features: the Gram's rank-one update, O(k^2)"
growth = "n^2"
small = 4
large = 32

