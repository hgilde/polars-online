reason = "two runs of one build on CI's macOS runner at Python 3.12 read the streaming case at 236.7 then 193.4 MiB and ten-target ewridge at 192.5 then 165.5 (2026-10-12 and 13), 14-18% apart, so a 15% tolerance either way failed one of them; 30% still catches the dense coef's +3.9 GiB"
changelog = "The peak-memory (RSS) budgets are recorded, at a 30% tolerance"

