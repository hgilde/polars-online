name: Release

# From 2.0.0 this repository publishes two forwarding packages and nothing
# else: `polars-online` and `polars-online-compat` each hold one small module
# that warns and forwards `polars_online` to `rheon` and `rheon-compat`. The
# library itself, with its wheels and its CLI, is released from the rheon
# repository. A forwarder's wheel is pure Python, so one job builds both.
#
# The trigger and the gate are the ones this file always had: dispatched on
# `main`, never tagged by hand. With `publish` off it is a rehearsal (both
# distributions are built and checked, nothing is uploaded). With `publish`
# on, the run waits for approval on the `pypi` environment and uploads.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish: after the build and the rheon check pass, upload to PyPI
          (on approval). Off: a rehearsal.
        type: boolean
        default: false

# Least privilege: no token scope by default, granted per job.
permissions: {}

# Releases queue, they do not cancel: a run may be halfway through an upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The version of the forwarders, and of the rheon they depend on.
  VERSION: "2.0.0"

jobs:
  # An sdist and a pure wheel of each forwarder.
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        package: [polars-online, polars-online-compat]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: build the sdist and the wheel
        working-directory: forwarders/${{ matrix.package }}
        run: uv build --out-dir dist
      - name: one sdist, one pure wheel, at the version
        working-directory: forwarders/${{ matrix.package }}/dist
        run: |
          ls -la
          name="${{ matrix.package }}"; name="${name//-/_}"
          test "$(ls | wc -l)" = 2
          test -f "${name}-${VERSION}.tar.gz"
          test -f "${name}-${VERSION}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package }}
          path: forwarders/${{ matrix.package }}/dist/*
          if-no-files-found: error

  # The forwarders depend on `rheon[polars]>=2.0.0` and
  # `rheon-compat[polars]>=2.0.0`: a forwarder uploaded before they exist
  # installs nowhere, and PyPI never lets a version be uploaded twice.
  rheon-on-pypi:
    name: rheon is on PyPI at the forwarders' version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: rheon and rheon-compat at the forwarders' version
        run: |
          for project in rheon rheon-compat; do
            url="https://pypi.org/pypi/${project}/${VERSION}/json"
            if ! curl -sf --retry 3 --retry-all-errors -o /dev/null "$url"; then
              echo "::error::${project}==${VERSION} is not on PyPI ($url); publish it first"
              exit 1
            fi
          done

  # THE HUMAN GATE IS HERE: the `pypi` environment has the owner as a required
  # reviewer, so this job parks on "Review deployments" until someone approves,
  # and only asks once the jobs above are green.
  #
  # Trusted publishing (OIDC), so there is no API token to store or rotate: the
  # trusted publisher of each project names this repository, this file
  # (release.yml) and the environment `pypi`. `skip-existing` lets the job run
  # again after a failure between the two uploads.
  publish:
    name: publish to PyPI
    needs: [build, rheon-on-pypi]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # PyPI trusted publishing (OIDC). This job does not check out.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-polars-online-compat
          path: dist-compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-polars-online
          path: dist
      - name: upload polars-online-compat
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-compat
          skip-existing: true
      - name: upload polars-online
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
