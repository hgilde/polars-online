name: Release

# A release is dispatched, never tagged by hand (the user, 2026-09-27, after
# the 0.11.0 tag: CI first met the branch on the tag, failed there, and the
# tag could not be moved). Dispatched on `main` with `publish` off it is the
# rehearsal: CI on all three OSes, every wheel and the CLI, the state
# hand-off and the suite on the newest Polars, and nothing tagged or uploaded.
# With `publish` on, the same run then waits for approval, uploads to PyPI,
# and only then creates the tag `v<version>` on the sha it tested and the
# GitHub release. So a tag always names what was published, and a version
# whose tag exists is refused before anything is built (`version`, below).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish: after every job passes, upload to PyPI (on approval), then
          tag v<version> and make the GitHub release. Off: a rehearsal.
        type: boolean
        default: false

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

# Releases queue, they do not cancel. `cancel-in-progress: true` everywhere
# else saves money by throwing away superseded work; here the "superseded" run
# may be halfway through uploading wheels or publishing to PyPI, and a
# half-published release costs far more than the runner minutes it saves.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version this run would publish, checked before anything is built:
  # agreed in all six places, a CHANGELOG section for it, and -- publishing --
  # a tag that does not exist yet, since release tags are immutable, and
  # only from `main` (scripts/release_version.py).
  version:
    name: the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      # What the README's links point at on PyPI: the tag a published run
      # creates on this sha, and the sha itself for a rehearsal.
      readme_ref: ${{ inputs.publish && steps.v.outputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: publishing is from main only
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release is published from main, not ${{ github.ref }}"
          exit 1
      - id: v
        name: the version agrees everywhere, and its tag is new
        run: >-
          uv run --no-project --python 3.12 python scripts/release_version.py
          ${{ inputs.publish && '--publish' || '' }} >> "$GITHUB_OUTPUT"

  # CI itself, on all three OSes (a dispatch takes its macOS and Windows
  # legs): the unit and integration tests and pytest, which none of the jobs
  # below run. The 0.11.0 tag failed there. `docs` in ci.yml asks for
  # `pages` and `id-token`, and a called workflow may ask for no more than
  # its caller grants, checked at start whether the job runs or not; it runs
  # only on a push to main, so under this call it is skipped and the grant is
  # inert (tests/test_release_workflow.py holds both to that).
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # A source distribution, so a platform with no wheel above can still build
  # from source (it needs a Rust toolchain, which is exactly why the wheel
  # matrix is wide).
  sdist:
    name: build the sdist
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # PyPI shows README.md as the project page, where a relative link to
      # another file resolves against pypi.org and is a 404. Rewritten to the
      # repository at the tag this run will create (the sha, rehearsing)
      # before maturin reads the file into the package metadata; the README
      # on GitHub keeps its relative links (scripts/pypi_readme.py).
      # `--no-project`: no sync, no extension build.
      - name: the README's links point at GitHub, at this ref
        run: uv run --no-project --python 3.12 python scripts/pypi_readme.py --ref "${{ needs.version.outputs.readme_ref }}"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist -m crates/online-py/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # Wheels + the CLI binary (docs/PLAN.md §10).
  #
  # The matrix is about what a user gets from `pip install`. A platform missing
  # here falls back to the sdist, which means the user needs a Rust toolchain --
  # the single most common way a pyo3 package fails to be "easily installable".
  # So it covers Intel and Apple-silicon macOS, Windows x64, and Linux x64 and
  # aarch64 glibc (for Graviton and for Docker on Apple silicon) and Linux x64
  # musl (for Alpine images).
  #
  # `abi3-py312` means one wheel per platform serves 3.12, 3.13, 3.14 and up,
  # rather than one per interpreter version.
  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    # Cold, the slowest runner (Intel macOS) needs ~40 min for the wheel and
    # ~30 for the CLI; Windows ~35 and ~25. 90 was cut by the first rehearsal.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: online
            cli: true
          # Intel: `macos-13` was retired from the hosted pool; `macos-15-intel`
          # is the label GitHub lists for x64 macOS now (actions/runner-images).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: online
            cli: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: online.exe
            cli: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            bin: online
            cli: true
          # Built natively on GitHub's arm64 runner, as polars builds its own.
          # Cross-compiling from x64 uses `manylinux2014-cross:aarch64`, whose
          # GCC 4.8.5 does not define `__ARM_ARCH`, and `ring` 0.17 (reached
          # through polars-io's cloud feature) refuses to assemble without it
          # (briansmith/ring#1728). On an arm64 host maturin-action picks the
          # native `manylinux2014_aarch64` image, with a current GCC, and the
          # wheel keeps the same `manylinux_2_17` tag.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            bin: online
            cli: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            bin: online
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # A timed-out or failed job still leaves a valid compile behind;
          # without this the next run starts cold again (same as ci.yml).
          cache-on-failure: true

      # No `uv sync` here: it builds the extension into a venv nobody uses --
      # maturin-action brings its own Python, and the CLI has no pyo3 in its
      # tree (`cargo tree -p online-cli` finds none). That was 26 minutes of
      # the Intel macOS job in the first rehearsal.

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # PyPI shows README.md as the project page, where a relative link to
      # another file resolves against pypi.org and is a 404. Rewritten to the
      # repository at the tag this run will create (the sha, rehearsing)
      # before maturin reads the file into the package metadata; the README
      # on GitHub keeps its relative links (scripts/pypi_readme.py).
      # `--no-project`: no sync, no extension build.
      - name: the README's links point at GitHub, at this ref
        run: uv run --no-project --python 3.12 python scripts/pypi_readme.py --ref "${{ needs.version.outputs.readme_ref }}"

      # maturin-action supplies the manylinux/musllinux container and the
      # cross-compilation toolchain; on macOS and Windows it is a thin wrapper
      # over the same `maturin build`.
      - name: build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/online-py/Cargo.toml
          sccache: "true"

      # On Linux the wheel was built inside maturin-action's manylinux
      # container, which runs as root with the workspace bind-mounted, so
      # `target/` comes back root-owned. The host `cargo build` below then
      # fails to open `target/release/.cargo-build-lock`, and rust-cache's
      # post step cannot tar the tree, so every Linux job ran cold (the
      # fourth rehearsal showed both). Passwordless sudo is a given on the
      # hosted Ubuntu images.
      - name: take back ownership of the build tree
        if: runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" target

      # Only on targets the runner builds natively. The musl wheel is
      # cross-compiled and ships without a prebuilt CLI; `cargo build
      # --release -p online-cli` from a checkout covers it, and the wheel is
      # the artifact that matters for `pip install`.
      #
      # maturin-action exports `RUSTC_WRAPPER=sccache` into the job, but for a
      # container build it installs sccache inside the container, not on the
      # runner, so a host `cargo build` after it cannot execute the wrapper
      # (the first rehearsal failed exactly there). An empty wrapper is treated
      # as none — measured on cargo 1.98, the stable this workflow installs.
      - name: build the CLI
        if: matrix.cli
        env:
          RUSTC_WRAPPER: ""
        run: cargo build --release -p online-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.cli
        with:
          name: cli-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}

  # docs/PLAN.md §9 class 7: a state written on macOS must load on Windows.
  write-state:
    name: write state (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No Python here either: `online-polars` has no pyo3 in its tree and
      # the test is pure Rust. The `uv sync` this used to run built the
      # extension into a venv the test never touched (17 minutes on macOS,
      # 23 on Windows in the first rehearsal).
      - name: write the hand-off state
        env:
          ONLINE_WRITE_STATE: ${{ github.workspace }}/handoff.state
        run: cargo test -p online-polars --test state_portability
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handoff-state
          path: handoff.state
          if-no-files-found: error

  read-state:
    name: read state (${{ matrix.os }})
    needs: write-state
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: handoff-state
      - name: load the macOS-written state and continue the stream
        # Absolute on purpose: the artifact lands in the workspace root, but
        # cargo runs an integration test with the *package* root as its
        # working directory (crates/online-polars/), so a bare
        # `handoff.state` is "No such file or directory". The first
        # rehearsal failed here on both OSes.
        env:
          ONLINE_FOREIGN_STATE: ${{ github.workspace }}/handoff.state
        run: cargo test -p online-polars --test state_portability

  next-polars:
    name: the suite on ${{ matrix.leg }} polars
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blocking. The top of the range the wheel actually declares --
          # newest stable, `<3` still honoured.
          - leg: the newest in-range
            unpin: false
            prerelease: ""
            blocking: true
          # Advisory. Everything above the ceiling: the next major, and its
          # release candidates and betas.
          - leg: the next major
            unpin: true
            prerelease: --prerelease=allow
            blocking: false
    # A red advisory leg must not withhold a wheel, and `needs` counts a
    # `continue-on-error` leg as passing, so this is the whole mechanism.
    continue-on-error: ${{ !matrix.blocking }}
    # The wheel declares a *range* of py-polars and is built against one of
    # them, so the release that ships is only known to work on the pinned
    # version until `polars-canary.yml` runs on the following Monday. That is
    # up to six days of a published wheel nobody has run on the newest
    # Polars. This job closes the window by running the same check at the one
    # moment it matters -- the release.
    #
    # Two legs, because "newest" means two different things and only one of
    # them is a promise we made:
    #
    # - *The newest in-range* blocks the publish (`release` needs this job).
    #   `<3` admits every 1.x and 2.x, so a resolver can hand a user a Polars newer
    #   than the one this wheel was built against, the day after it ships.
    #   That is inside what we declared, so it has to be green before the
    #   wheel goes out -- red means cap the range or fix the code (README,
    #   *Versioning and the Polars pin*), decided before publishing.
    # - *The next major* is advisory. It unpins entirely and allows
    #   prereleases, so it is the early warning the canary gives weekly,
    #   taken again at the release. A 3.0 beta that breaks us is worth knowing
    #   about and is not a reason to withhold a patch release for a range
    #   that ends below 3.
    #
    # The split also keeps the blocking leg honest across a major bump: an
    # unpinned blocking job would resolve to 3.0 the day it ships and block
    # every release on a major nobody had adopted yet.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Same treatment as ci.yml's test job and the canary's: linking this
      # workspace's polars-laden test binaries exhausts the runner without it.
      - name: free disk and use a leaner linker
        run: |
          echo "--- disk before ---"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          echo "--- disk after ---"; df -h /
          sudo apt-get install -y --no-install-recommends lld
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-fuse-ld=lld"]\n' \
            >> .cargo/config.toml

      # Advisory leg only: the same unpin the canary does, dropping the range
      # rather than widening it so a new major is tested the week it appears
      # rather than silently excluded by the `<3` in pyproject.toml. The
      # blocking leg skips this on purpose -- it tests the range as declared.
      - name: unpin py-polars
        if: matrix.unpin
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          s, n = re.subn(r'"polars[<>=~!][^"]*"', '"polars"', p.read_text(), count=1)
          assert n == 1, "the polars dependency line moved; fix this unpin"
          p.write_text(s)
          PY

      # `--prerelease=allow` is what makes a 2.0rc visible. The blocking leg
      # passes no flag, and must not pass `--prerelease=disallow`: that mode
      # applies to every package, and the docs group's `furo` needs
      # `sphinx-basic-ng>=1.0.0b2`, so the whole resolution fails (the 0.5.0
      # tag's first run). uv's default already declines a prerelease wherever
      # a stable version satisfies the range -- polars resolves to the newest
      # stable under the ceiling -- which is what an ordinary install gets.
      - run: uv sync ${{ matrix.prerelease }} --upgrade-package polars
      - name: versions in play
        run: uv run python -c "import polars; print('py-polars', polars.__version__)"

      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      # `pins` marks the tests that can only pass on the pinned polars; see
      # the marker's description in pyproject.toml.
      - run: uv run pytest -q -m "not soak and not pins"

  # THE HUMAN GATE IS HERE. Since 2026-09-06 the `pypi` environment has the
  # owner as a required reviewer (self-review allowed -- with one reviewer,
  # preventing it would deadlock every release), so this job parks on "Review
  # deployments" until someone approves, and it only ever asks once every
  # other job is green. That is deliberate: the gate sits in front of the one
  # step nothing can undo, and in front of nothing else. PyPI never lets a
  # version number be reused, and `v*` tags cannot be deleted or moved
  # (ruleset "release tags are immutable", no bypass), so a broken release is
  # superseded by the next version rather than replaced; declined here, the
  # run creates no tag, and the version can be dispatched again.
  #
  # Trusted publishing (OIDC), so there is no API token to store or rotate.
  # Registered on PyPI on 2026-09-03 as a pending trusted publisher for
  # `polars-online` (owner hgilde, repository polars-online, workflow
  # release.yml, environment pypi); the first publish claimed the name.
  publish:
    name: publish to PyPI
    needs: [version, ci, sdist, build, read-state, next-polars]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # PyPI trusted publishing (OIDC). This job does not check out, so it
      # needs no `contents` scope at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: collect the wheels
        run: |
          mkdir -p dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  # The tag, once what it names is on PyPI: on the sha every job above
  # tested, never a moving `HEAD`. Annotated, with the CHANGELOG's section.
  tag:
    name: tag the release
    needs: [version, publish]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the CHANGELOG's section for this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY' > notes.md
          import os, re, pathlib
          v = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\] .*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          assert m, f"no CHANGELOG section for {v}"
          print(f"polars-online {v}\n{m.group(1).rstrip()}")
          PY
          head -5 notes.md
      - name: create and push the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F notes.md "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  release:
    name: publish the release
    needs: [version, tag]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # creating the GitHub release and uploading its assets
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: collect the files
        run: |
          mkdir -p release
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          for d in artifacts/cli-*; do
            target="${d#artifacts/cli-}"
            for f in "$d"/*; do
              cp "$f" "release/$(basename "$f" .exe)-$target$([ "${f##*.}" = exe ] && echo .exe)"
            done
          done
          ls -la release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: artifacts/notes/notes.md
          files: release/*
