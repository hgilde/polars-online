name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

# Releases queue, they do not cancel. `cancel-in-progress: true` everywhere
# else saves money by throwing away superseded work; here the "superseded" run
# may be halfway through uploading wheels or publishing to PyPI, and a
# half-published release costs far more than the runner minutes it saves.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A source distribution, so a platform with no wheel above can still build
  # from source (it needs a Rust toolchain, which is exactly why the wheel
  # matrix is wide).
  sdist:
    name: build the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist -m crates/online-py/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # Wheels + the CLI binary (docs/PLAN.md §10).
  #
  # The matrix is about what a user gets from `pip install`. A platform missing
  # here falls back to the sdist, which means the user needs a Rust toolchain --
  # the single most common way a pyo3 package fails to be "easily installable".
  # So it covers Intel and Apple-silicon macOS, Windows x64, and Linux x64 and
  # aarch64 glibc (for Graviton and for Docker on Apple silicon) and Linux x64
  # musl (for Alpine images).
  #
  # `abi3-py312` means one wheel per platform serves 3.12, 3.13, 3.14 and up,
  # rather than one per interpreter version.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: online
            cli: true
          # Intel: `macos-13` was retired from the hosted pool; `macos-15-intel`
          # is the label GitHub lists for x64 macOS now (actions/runner-images).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: online
            cli: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: online.exe
            cli: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            bin: online
            cli: true
          # Built natively on GitHub's arm64 runner, as polars builds its own.
          # Cross-compiling from x64 uses `manylinux2014-cross:aarch64`, whose
          # GCC 4.8.5 does not define `__ARM_ARCH`, and `ring` 0.17 (reached
          # through polars-io's cloud feature) refuses to assemble without it
          # (briansmith/ring#1728). On an arm64 host maturin-action picks the
          # native `manylinux2014_aarch64` image, with a current GCC, and the
          # wheel keeps the same `manylinux_2_17` tag.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            bin: online
            cli: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            bin: online
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync

      # maturin-action supplies the manylinux/musllinux container and the
      # cross-compilation toolchain; on macOS and Windows it is a thin wrapper
      # over the same `maturin build`.
      - name: build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/online-py/Cargo.toml
          sccache: "true"

      # Only on targets the runner builds natively. The musl wheel is
      # cross-compiled and ships without a prebuilt CLI; `cargo install
      # online-cli` covers it, and the wheel is the artifact that matters
      # for `pip install`.
      #
      # maturin-action exports `RUSTC_WRAPPER=sccache` into the job, but for a
      # container build it installs sccache inside the container, not on the
      # runner, so a host `cargo build` after it cannot execute the wrapper
      # (the first rehearsal failed exactly there). An empty wrapper is treated
      # as none — measured on cargo 1.98, the stable this workflow installs.
      - name: build the CLI
        if: matrix.cli
        env:
          RUSTC_WRAPPER: ""
        run: uv run cargo build --release -p online-cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.cli
        with:
          name: cli-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}

  # docs/PLAN.md §9 class 7: a state written on macOS must load on Windows.
  write-state:
    name: write state (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
      - name: write the hand-off state
        env:
          ONLINE_WRITE_STATE: ${{ github.workspace }}/handoff.state
        run: uv run cargo test -p online-polars --test state_portability
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handoff-state
          path: handoff.state
          if-no-files-found: error

  read-state:
    name: read state (${{ matrix.os }})
    needs: write-state
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: handoff-state
      - name: load the macOS-written state and continue the stream
        env:
          ONLINE_FOREIGN_STATE: handoff.state
        run: uv run cargo test -p online-polars --test state_portability

  release:
    name: publish the release
    needs: [sdist, build, read-state]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # creating the GitHub release and uploading its assets
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: collect the files
        run: |
          mkdir -p release
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          for d in artifacts/cli-*; do
            target="${d#artifacts/cli-}"
            for f in "$d"/*; do
              cp "$f" "release/$(basename "$f" .exe)-$target$([ "${f##*.}" = exe ] && echo .exe)"
            done
          done
          ls -la release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true

  # Publishing is a separate, manually-approved job: a tag should be able to
  # build and attach artifacts without also pushing to PyPI. Uses trusted
  # publishing (OIDC), so there is no API token to store or rotate.
  #
  # Before the first run: claim the project name on PyPI and register this
  # repository/workflow as a trusted publisher. The name `polars-online` has
  # NOT been checked as available -- do that first (PLAN section 10).
  publish:
    name: publish to PyPI
    needs: [sdist, build, read-state]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # PyPI trusted publishing (OIDC). This job does not check out, so it
      # needs no `contents` scope at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: collect the wheels
        run: |
          mkdir -p dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
