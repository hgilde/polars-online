name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A source distribution, so a platform with no wheel above can still build
  # from source (it needs a Rust toolchain, which is exactly why the wheel
  # matrix is wide).
  sdist:
    name: build the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/online-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Wheels + the CLI binary (docs/PLAN.md §10).
  #
  # The matrix is about what a user gets from `pip install`. A platform missing
  # here falls back to the sdist, which means the user needs a Rust toolchain --
  # the single most common way a pyo3 package fails to be "easily installable".
  # So it covers Intel and Apple-silicon macOS, Windows x64, and Linux x64 and
  # aarch64 in both glibc and musl flavours (aarch64 for Graviton and for Docker
  # on Apple silicon; musl for Alpine images).
  #
  # `abi3-py312` means one wheel per platform serves 3.12, 3.13, 3.14 and up,
  # rather than one per interpreter version.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: online
            cli: true
          - os: macos-13 # the last Intel runner
            target: x86_64-apple-darwin
            bin: online
            cli: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: online.exe
            cli: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            bin: online
            cli: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            bin: online
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            bin: online
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync

      # maturin-action supplies the manylinux/musllinux container and the
      # cross-compilation toolchain; on macOS and Windows it is a thin wrapper
      # over the same `maturin build`.
      - name: build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/online-py/Cargo.toml
          sccache: "true"

      # Only on targets the runner builds natively. The cross-compiled Linux
      # wheels (aarch64, musl) ship without a prebuilt CLI; `cargo install
      # online-cli` covers those, and the wheel is the artifact that matters
      # for `pip install`.
      - name: build the CLI
        if: matrix.cli
        run: uv run cargo build --release -p online-cli

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

      - uses: actions/upload-artifact@v4
        if: matrix.cli
        with:
          name: cli-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}

  # docs/PLAN.md §9 class 7: a state written on macOS must load on Windows.
  write-state:
    name: write state (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: write the hand-off state
        env:
          ONLINE_WRITE_STATE: ${{ github.workspace }}/handoff.state
        run: uv run cargo test -p online-polars --test state_portability
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-state
          path: handoff.state
          if-no-files-found: error

  read-state:
    name: read state (${{ matrix.os }})
    needs: write-state
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - uses: actions/download-artifact@v5
        with:
          name: handoff-state
      - name: load the macOS-written state and continue the stream
        env:
          ONLINE_FOREIGN_STATE: handoff.state
        run: uv run cargo test -p online-polars --test state_portability

  release:
    name: publish the release
    needs: [sdist, build, read-state]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: collect the files
        run: |
          mkdir -p release
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          for d in artifacts/cli-*; do
            target="${d#artifacts/cli-}"
            for f in "$d"/*; do
              cp "$f" "release/$(basename "$f" .exe)-$target$([ "${f##*.}" = exe ] && echo .exe)"
            done
          done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # Publishing is a separate, manually-approved job: a tag should be able to
  # build and attach artifacts without also pushing to PyPI. Uses trusted
  # publishing (OIDC), so there is no API token to store or rotate.
  #
  # Before the first run: claim the project name on PyPI and register this
  # repository/workflow as a trusted publisher. The name `polars-online` has
  # NOT been checked as available -- do that first (PLAN section 10).
  publish:
    name: publish to PyPI
    needs: [sdist, build, read-state]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: collect the wheels
        run: |
          mkdir -p dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
