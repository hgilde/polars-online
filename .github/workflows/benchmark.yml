# Throughput tracking (ENHANCEMENTS E11). Reported, never gating: a CI runner's
# absolute numbers are not comparable to a workstation's, and a shared runner is
# noisy enough that a hard threshold would fail for reasons unrelated to the
# code. What this catches is a *large* regression, by writing the numbers into
# the job summary where a reviewer sees them next to the diff.
name: Benchmark

# Reported, never gating -- a shared runner is too noisy for a threshold. It
# ran weekly and on demand while minutes were metered; the repo is public now
# (2026-09-02), so it also runs on a push that can change the numbers. Not on
# pull requests: the summary is worth reading on the branch that ships, and a
# fork's PR would run it on a runner nobody is comparing against.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  schedule:
    - cron: "41 5 * * 1" # Mondays, before the weekly CI
  workflow_dispatch:
    inputs:
      ref:
        # A control run: measure an older commit with *this* workflow file, so
        # a branch and the main it forked from get the same tables on the same
        # runner type. Empty means the ref the workflow was dispatched on.
        description: "Commit or branch to benchmark (default: this one)"
        required: false
        default: ""

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The artifact is named for the commit that was measured, which with a
      # `ref` input is not `github.sha`.
      - name: name the numbers after the commit they measure
        id: measured
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      # Both tables go to the job summary and to `benchmark.md`, which the
      # artifact keeps: the summary is only readable in the browser, and a
      # comparison across two runs (a branch against main, one machine
      # against another) wants a file. One run of each script, not two.
      - name: benchmark
        run: |
          set -o pipefail   # a failing script must still fail the step through the tee
          {
            echo "## Throughput"
            echo
            uv run python scripts/benchmark.py --rows 100000 --markdown
            echo
            echo "## Thread scaling (k=20, 64 groups)"
            echo
            # Throughput alone hides a change that serializes the fan-out: it
            # looks fine on one thread and costs 4x on ten (docs/PERFORMANCE.md P8).
            uv run python scripts/scaling_bench.py --rows 200000 --markdown
          } | tee benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: keep the numbers as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ steps.measured.outputs.sha }}
          path: benchmark.md
