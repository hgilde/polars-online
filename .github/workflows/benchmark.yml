# Throughput tracking (ENHANCEMENTS E11). Reported, never gating: a CI runner's
# absolute numbers are not comparable to a workstation's, and a shared runner is
# noisy enough that a hard threshold would fail for reasons unrelated to the
# code. What this catches is a *large* regression, by writing the numbers into
# the job summary where a reviewer sees them next to the diff.
name: Benchmark

# Reported, never gating -- a shared runner is too noisy for a threshold. It
# ran weekly and on demand while minutes were metered; the repo is public now
# (2026-09-02), so it also runs on a push that can change the numbers. Not on
# pull requests: the summary is worth reading on the branch that ships, and a
# fork's PR would run it on a runner nobody is comparing against.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  schedule:
    - cron: "41 5 * * 1" # Mondays, before the weekly CI
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      - name: benchmark
        run: |
          {
            echo "## Throughput"
            echo
            uv run python scripts/benchmark.py --rows 100000 --markdown
            echo
            echo "## Thread scaling (k=20, 64 groups)"
            echo
            # Throughput alone hides a change that serializes the fan-out: it
            # looks fine on one thread and costs 4x on ten (docs/PERFORMANCE.md P8).
            uv run python scripts/scaling_bench.py --rows 200000 --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: keep the numbers as an artifact
        run: uv run python scripts/benchmark.py --rows 100000 --markdown > benchmark.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark.md
