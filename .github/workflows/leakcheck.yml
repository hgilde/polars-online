# docs/PLAN.md task 18: the native leak check, weekly. tests/test_ffi_memory.py
# watches RSS, so it needs a leak big enough to move it; scripts/leakcheck.sh
# counts the blocks nothing references any more, however small, with `leaks`
# on macOS and valgrind on Linux. Nothing gates on it -- it is scheduled, not
# on push -- so a red run *is* the report: GitHub mails the owner when a
# scheduled workflow fails. Deferred while minutes were metered (valgrind is
# ~50x slower than native, macOS billed at 10x); the repo is public now.
name: Leak check

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays, 07:17 UTC, after the canary
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job.
permissions: {}

# A second run tells you nothing the first will not; do not pay for both.
concurrency:
  group: leakcheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: leak check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The macOS leg is recorded, not relied on (see the matrix): it may fail
    # without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `leaks --atExit` gives no report on GitHub's macOS runners -- nothing
        # at all even on a bare interpreter, on macOS 15.7.9 and 26.6.2 alike
        # (2026-09-14) -- where on a developer Mac (15.7.3) it reports every
        # time. Its target sometimes dies first in the stack logger that
        # `leaks --atExit` turns on ("possible double free or buffer overrun",
        # in uniquing_table_node_release_internal), but not repeatably and not
        # on any one import: two runs put it on different ones. Until the
        # diagnostic step below shows what the runner needs, the native check
        # on macOS is run by hand (scripts/leakcheck.sh), and Linux carries it
        # here.
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-latest, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      # Same treatment as ci.yml's test job, for the same reasons: the restored
      # target/ does not fit the image's free disk, and the rustflags must be
      # in place before anything compiles.
      - name: free disk and use a leaner linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h /
          # The image's package lists go stale between image builds: valgrind
          # pulls libc6-dbg from noble-updates, whose listed version 404'd on
          # 2026-09-14 until the lists were refreshed.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends lld valgrind
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-fuse-ld=lld"]\n' \
            >> .cargo/config.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      - name: leak check
        run: |
          set +e
          scripts/leakcheck.sh > leakcheck.txt; status=$?
          cat leakcheck.txt
          { echo "### leak check (${RUNNER_OS})"; echo '```'; cat leakcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A check that has gone blind reports "clean" forever: this script with
      # the default allocator did exactly that against a deliberate 128 MB
      # leak. The control leaks one object per iteration and must be caught.
      - name: the check can still see a leak (control)
        if: always()
        env:
          LEAKCHECK_CONTROL: "1"
        run: |
          set +e
          scripts/leakcheck.sh > control.txt; status=$?
          cat control.txt
          { echo "### control (${RUNNER_OS}, must report a leak)"; echo '```'; cat control.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 1 ]; then
            echo "::error::the control leak was not detected (exit $status): the leak check is blind"
            exit 1
          fi

      # Informational, macOS only, and never fails the run: what this runner
      # needs for `leaks` to report. A bare interpreter under `leaks --atExit`
      # as it is, under sudo, and after DevToolsSecurity authorizes the tools;
      # and what might forbid it -- the developer-tools authorization, System
      # Integrity Protection, and a hardened-runtime signature on the
      # interpreter, which refuses a debugger without get-task-allow.
      - name: what leaks needs on this runner (macOS, informational)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          PY=$(uv run python -c 'import sys; print(sys.executable)')
          REAL=$("$PY" -c 'import os, sys; print(os.path.realpath(sys.executable))')
          try() {
            echo "--- $1"
            out=$("${@:2}" leaks --atExit -- "$PY" -c pass 2>&1) && status=0 || status=$?
            grep -E "leaks for|Assertion|rror|annot|denied|not permitted" <<<"$out" | head -5 || true
            echo "($(grep -c . <<<"$out" || true) lines of output, exit status $status)"
          }
          {
            echo "macOS $(sw_vers -productVersion) $(sw_vers -buildVersion)"
            echo "DevToolsSecurity: $(DevToolsSecurity -status 2>&1)"
            echo "SIP: $(csrutil status 2>&1)"
            echo "interpreter: $REAL"
            codesign -dv --verbose=4 "$REAL" 2>&1 | grep -E "^(Identifier|Format|CodeDirectory|Signature|Authority|Runtime)" || true
            try "as it is"
            if sudo -n true 2>/dev/null; then
              try "under sudo" sudo -E
              sudo DevToolsSecurity -enable >/dev/null 2>&1 || true
              echo "DevToolsSecurity after enabling: $(DevToolsSecurity -status 2>&1)"
              try "after DevToolsSecurity -enable"
            else
              echo "--- under sudo, and after DevToolsSecurity -enable: skipped (sudo needs a password here)"
            fi
          } | tee leaks-runner.txt
          { echo "### what leaks needs (${RUNNER_OS}, informational)"; echo '```'; cat leaks-runner.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
