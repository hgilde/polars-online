# docs/PLAN.md task 18: the native leak check, weekly. tests/test_ffi_memory.py
# watches RSS, so it needs a leak big enough to move it; scripts/leakcheck.sh
# counts the blocks nothing references any more, however small, with `leaks`
# on macOS and valgrind on Linux. Nothing gates on it -- it is scheduled, not
# on push -- so a red run *is* the report: GitHub mails the owner when a
# scheduled workflow fails. Deferred while minutes were metered (valgrind is
# ~50x slower than native, macOS billed at 10x); the repo is public now.
name: Leak check

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays, 07:17 UTC, after the canary
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job.
permissions: {}

# A second run tells you nothing the first will not; do not pay for both.
concurrency:
  group: leakcheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: leak check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # macOS 26 is watched, not relied on (see the matrix): its leg may fail
    # without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `leaks` works on macOS 15 and not on macOS 26, which macos-latest
        # became. There it reports nothing even on a bare interpreter, and the
        # stack logging it turns on in its target asserts once polars is
        # imported -- "possible double free or buffer overrun", in
        # uniquing_table_node_release_internal -- with or without
        # MallocStackLogging set (2026-09-14, and the probe step below):
        # polars alone sets it off, not this package. So macos-15 carries the
        # check, and macos-latest runs it and the probes for the record until
        # a later image fixes it.
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: macos-15, experimental: false }
          - { os: macos-latest, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      # Same treatment as ci.yml's test job, for the same reasons: the restored
      # target/ does not fit the image's free disk, and the rustflags must be
      # in place before anything compiles.
      - name: free disk and use a leaner linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h /
          # The image's package lists go stale between image builds: valgrind
          # pulls libc6-dbg from noble-updates, whose listed version 404'd on
          # 2026-09-14 until the lists were refreshed.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends lld valgrind
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-fuse-ld=lld"]\n' \
            >> .cargo/config.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      - name: leak check
        run: |
          set +e
          scripts/leakcheck.sh > leakcheck.txt; status=$?
          cat leakcheck.txt
          { echo "### leak check (${RUNNER_OS})"; echo '```'; cat leakcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A check that has gone blind reports "clean" forever: this script with
      # the default allocator did exactly that against a deliberate 128 MB
      # leak. The control leaks one object per iteration and must be caught.
      - name: the check can still see a leak (control)
        if: always()
        env:
          LEAKCHECK_CONTROL: "1"
        run: |
          set +e
          scripts/leakcheck.sh > control.txt; status=$?
          cat control.txt
          { echo "### control (${RUNNER_OS}, must report a leak)"; echo '```'; cat control.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 1 ]; then
            echo "::error::the control leak was not detected (exit $status): the leak check is blind"
            exit 1
          fi

      # Informational, macOS only, and never fails the run: `leaks` with stack
      # logging on a bare interpreter, numpy, polars and polars_online, each
      # on its own, to say which of them sets off macOS 26's assertion (see
      # the matrix). On macOS 15 each of them reports.
      - name: which workload trips the stack logger (macOS, informational)
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          PY=$(uv run python -c 'import sys; print(sys.executable)')
          report="$(sw_vers -productVersion) $(sw_vers -buildVersion)"$'\n'
          probe() {
            out=$(PYTHONMALLOC=malloc MallocStackLogging=1 leaks --atExit --quiet -- "$PY" -c "$2" 2>&1 || true)
            if grep -q "Assertion failed" <<<"$out"; then verdict="ASSERTS"
            elif grep -q "leaks for" <<<"$out"; then verdict="reports"
            else verdict="no report ($(grep -c . <<<"$out" || true) lines): $(grep -m1 . <<<"$out" || true)"; fi
            report+=$(printf '%-24s %s' "$1" "$verdict")$'\n'
          }
          probe "bare interpreter" "pass"
          probe "import numpy" "import numpy"
          probe "import polars" "import polars"
          probe "polars, one frame" "import polars as pl; pl.DataFrame({'a': [1.0, 2.0]}).sum()"
          probe "import polars_online" "import polars_online"
          probe "polars_online, one fit" "import polars as pl, polars_online as po; po.ModelBank([po.spec.ewridge('m', targets=['y'], features=['x'], halflife=5.0)]).fit_predict(pl.DataFrame({'x': [1.0, 2.0, 3.0], 'y': [2.0, 4.0, 6.0]}))"
          printf '%s' "$report"
          { echo "### stack logger probes (${RUNNER_OS}, informational)"; echo '```'; printf '%s' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
