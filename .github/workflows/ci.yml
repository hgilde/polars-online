name: CI

# The repo is public, so Actions is unmetered and the full matrix runs on every
# push and pull request. While it was private the metering was severe -- macOS
# bills at 10x and Windows at 2x -- and this file carried a `paths-ignore` and
# a macOS-only-on-schedule matrix to survive a 2,000 minute budget. Both are
# gone; see docs/RELEASE-READINESS.md for what that cost and why.
#
# `paths-ignore` in particular does not come back if CI is ever a required
# status check: a doc-only pull request would then never run the check, and
# never become mergeable.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation is pure disk cost in CI: every job starts cold, so
  # nothing is ever reused, and the artifacts are large.
  CARGO_INCREMENTAL: 0

# `cargo` is invoked through `uv run` everywhere: online-py is built with pyo3's
# abi3-py312, which needs an interpreter >= 3.12 at build time. `uv run` puts the
# project's 3.12 venv on VIRTUAL_ENV, which is what pyo3's build script picks up.
jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # A cold Windows job spends ~70 of its ~80 minutes compiling, and by
          # default rust-cache skips its save step when the job fails -- so a
          # single red test threw away the whole compile and the next run
          # started cold again. Every Windows run to date logged "No cache
          # found." Build artifacts from a failed test run are still valid.
          cache-on-failure: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - run: uv sync

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: uv run cargo clippy --workspace --all-targets -- -D warnings

      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .

  # The first-ever CI run died here with `ld terminated with signal 7 [Bus
  # error]` on ubuntu, on two test binaries linking one second apart. That is
  # resource exhaustion during concurrent linking, not a code fault: this
  # workspace links polars into ~10 separate test binaries, and GNU ld (the
  # default `cc` linker on the Ubuntu image) is both memory-hungry and, when
  # the disk fills under an mmap'd write, prone to SIGBUS rather than a clean
  # ENOSPC.
  #
  # The `df -h` instrumentation answered it: **it was disk.** The runner starts
  # with 9.3 GB free (72G, 88% used) against a ~20 GB debug build of this
  # workspace, so `ld` took SIGBUS on an mmap write to a full filesystem rather
  # than a clean ENOSPC. Removing the unused Android SDK, .NET and GHC recovers
  # 21 GB (9.3 -> 30 GB free) and the build passes. `lld` stays because it also
  # links large Rust binaries faster and in less RSS, but it was not the fix.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # A cold Windows job spends ~70 of its ~80 minutes compiling, and by
          # default rust-cache skips its save step when the job fails -- so a
          # single red test threw away the whole compile and the next run
          # started cold again. Every Windows run to date logged "No cache
          # found." Build artifacts from a failed test run are still valid.
          cache-on-failure: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # Before `uv sync`, which compiles the extension: rustflags are part of
      # cargo's fingerprint, so writing them afterwards invalidated that build
      # and made `maturin develop --release` recompile the workspace from
      # scratch -- 18 minutes of pure duplication on every Linux run (Windows,
      # with no such step, finishes the same maturin build in 31 seconds).
      - name: free disk and use a leaner linker (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "--- disk before ---"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          echo "--- disk after ---"; df -h /
          free -m || true
          sudo apt-get install -y --no-install-recommends lld
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-fuse-ld=lld"]\n' \
            >> .cargo/config.toml

      # Real-time scanning inspects every one of the ~100k files a cargo build
      # writes. Best-effort: never fail the job over it.
      - name: exclude the build from Defender (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE","$env:USERPROFILE\.cargo","$env:USERPROFILE\.rustup"

      - run: uv sync

      - name: cargo test
        run: uv run cargo test --workspace

      - name: disk after the build
        if: always() && runner.os == 'Linux'
        run: df -h /

      - name: build the extension
        run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      - name: pytest
        run: uv run pytest

      # Reported, never gating (docs/TESTING.md T-D4).
      - name: coverage (python)
        run: uv run pytest --cov=polars_online --cov-report=term -q
        continue-on-error: true
