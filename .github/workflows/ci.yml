name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# `cargo` is invoked through `uv run` everywhere: online-py is built with pyo3's
# abi3-py312, which needs an interpreter >= 3.12 at build time. `uv run` puts the
# project's 3.12 venv on VIRTUAL_ENV, which is what pyo3's build script picks up.
jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: uv run cargo clippy --workspace --all-targets -- -D warnings

      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync

      - name: cargo test
        run: uv run cargo test --workspace

      - name: build the extension
        run: uv run maturin develop --release -m crates/online-py/Cargo.toml

      - name: pytest
        run: uv run pytest

      # Reported, never gating (docs/TESTING.md T-D4).
      - name: coverage (python)
        run: uv run pytest --cov=polars_online --cov-report=term -q
        continue-on-error: true
