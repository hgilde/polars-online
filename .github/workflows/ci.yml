name: CI

# This repository ships two forwarding packages, `polars-online` and
# `polars-online-compat` (forwarders/). CI runs their tests: in stub mode, which
# needs no network and no wheel, on the three systems and both ends of the
# supported Python range; and in real mode, against rheon from PyPI and
# polars-online 1.6.0 from PyPI (which writes the 1.x pickle the forwarder loads).
# release.yml runs the real mode on three systems, and checks the built wheels.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The rheon the forwarders depend on.
  RHEON: "2.0.0"
  PYTHONUTF8: "1"

jobs:
  stub:
    name: stub mode, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: the environment, pytest only (the stubs stand in for rheon and Polars)
        run: |
          uv venv --python "${{ matrix.python }}" "${{ runner.temp }}/env"
          bindir=bin; exe=python
          if [ "$RUNNER_OS" = Windows ]; then bindir=Scripts; exe=python.exe; fi
          echo "PY=${{ runner.temp }}/env/$bindir/$exe" >> "$GITHUB_ENV"
          uv pip install --python "${{ runner.temp }}/env/$bindir/$exe" pytest
      - name: forwarders/tests, stub mode
        run: '"$PY" -m pytest forwarders/tests -v -p no:cacheprovider'

  real:
    name: real mode, rheon and polars-online 1.6.0 from PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: the environments, from PyPI
        run: |
          uv venv --python 3.12 "${{ runner.temp }}/new"
          uv venv --python 3.12 "${{ runner.temp }}/old"
          uv pip install --python "${{ runner.temp }}/new/bin/python" "rheon[polars,numpy]==${RHEON}" pytest
          uv pip install --python "${{ runner.temp }}/old/bin/python" "polars-online[numpy]==1.6.0"
          uv pip list --python "${{ runner.temp }}/new/bin/python"
      - name: forwarders/tests, real mode
        run: |
          export FORWARDER_REAL_PYTHON="${{ runner.temp }}/new/bin/python"
          export FORWARDER_OLD_PYTHON="${{ runner.temp }}/old/bin/python"
          "$FORWARDER_REAL_PYTHON" -m pytest forwarders/tests -v -p no:cacheprovider
