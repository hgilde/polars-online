# docs/PLAN.md §10: the wheel is built against one Polars and declares a
# range (`polars>=1.34.0,<2`), so a new py-polars that breaks one of the three
# interfaces we ride on -- the expression plugin's negotiated ABI, the
# `PyDataFrame`/`PySeries` extension types, the IO plugin -- is invisible
# until a user upgrades. This job installs the newest py-polars on a schedule,
# builds the wheel as CI does and runs the whole suite on it. It opens nothing on
# its own: a failure here is the notification, and the README's *Versioning
# and the Polars pin* says what happens next (a cap on the range in a patch
# release, then the fix).
#
# It is also the evidence for moving the range. That only works if a red
# canary means *Polars broke us* and nothing else -- so this job has to be
# as reliable as CI, not less, and only one thing may vary in it.
name: Polars canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

# A second canary tells you nothing the first will not; do not pay for both.
concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  latest-polars:
    name: build and test against the latest Polars
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Same treatment as ci.yml's test job. Without it this job would fail
      # every Monday on `ld terminated with signal 7` -- linking this
      # workspace's ~10 polars-laden test binaries exhausts the runner -- and a
      # canary that cries wolf weekly is worse than no canary, because the
      # signal it exists to carry gets ignored.
      - name: free disk and use a leaner linker
        run: |
          echo "--- disk before ---"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          echo "--- disk after ---"; df -h /
          free -m || true
          sudo apt-get install -y --no-install-recommends lld
          mkdir -p .cargo
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-C", "link-arg=-fuse-ld=lld"]\n' \
            >> .cargo/config.toml

      # The Python side only. The wheel carries its own, statically linked
      # copy of polars (`polars = "=0.55.2"` in Cargo.toml) that never meets
      # the user's -- data crosses on the Arrow C Data Interface -- so the
      # Polars release that can break a user is py-polars, and that is the
      # one this job installs. The Rust copy moves by hand: pyo3-polars pins
      # its polars (0.28 wants ^0.55.1) and `crates/online-polars` pins
      # polars-arrow, polars-parquet and polars-utils to the same release, so
      # the `version = "*"` + `cargo update -p polars` this step used to do
      # would have put two polars in the tree the day 0.56 shipped and failed
      # the build for a reason that is not "Polars broke us".
      #
      # The range in pyproject.toml is dropped rather than widened so that a
      # 2.0 is tested the week it appears, not silently excluded by `<2`; the
      # step fails if the line is not where it expects, since a canary that
      # quietly tests the pinned version is worse than none.
      - name: unpin py-polars
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          s, n = re.subn(r'"polars[<>=~!][^"]*"', '"polars"', p.read_text(), count=1)
          assert n == 1, "the polars dependency line moved; fix this unpin"
          p.write_text(s)
          PY

      # Only polars moves; the rest of the lock stays as CI tests it, so the
      # one variable in this run is the Polars release.
      - run: uv sync --upgrade-package polars
      - name: versions in play
        run: |
          uv run python -c "import polars; print('py-polars', polars.__version__)"
          cargo tree -p polars --depth 0 || true

      - run: uv run cargo test --workspace
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      # `-m` replaces the `-m 'not soak'` in pyproject's addopts rather than
      # adding to it, so both go here. `pins` marks the two tests that assert
      # this repo's own polars pins -- meaningless with polars unpinned, and
      # the first run of this job was red on exactly one of them.
      - run: uv run pytest -q -m "not soak and not pins"
