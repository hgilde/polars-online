# docs/PLAN.md §10: the wheel is built against one Polars and declares a
# range (`polars>=1.34.0,<3`), so a new py-polars that breaks one of the three
# interfaces we ride on -- the `PyDataFrame`/`PySeries` extension types, the
# IO plugin, and the Arrow PyCapsule interface that `fit_predict_arrow` hands
# its output over -- is invisible until a user upgrades. This job installs the newest py-polars on a schedule,
# builds the wheel as CI does and runs the whole suite on it. It opens nothing on
# its own: a failure here is the notification, and the README's *Versioning
# and the Polars pin* says what happens next (a cap on the range in a patch
# release, then the fix).
#
# It is also the evidence for moving the range. That only works if a red
# canary means *Polars broke us* and nothing else -- so this job has to be
# as reliable as CI, not less, and only one thing may vary in it.
#
# The newest Polars proves the ceiling, and says nothing of the floor. Once a
# month `floor-polars` runs the suite on the floor itself, as every release
# does (release.yml), so a change that needs a newer Polars than the range
# admits shows between releases too (review 2026-10-06, AP7 and CI2).
name: Polars and NumPy canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC: the newest Polars and NumPy
    - cron: "47 6 1 * *" # the 1st of each month, 06:47 UTC: the floor
  workflow_dispatch:

# Least privilege: no token scope by default, granted per job. This matters more
# once the repo is public, when a fork's pull request can trigger these.
permissions: {}

# A second canary tells you nothing the first will not; do not pay for both.
# Per schedule, though: when the 1st is a Monday both fire, and the floor
# must not cancel the week's run, nor the week's run the floor.
concurrency:
  group: canary-${{ github.event.schedule }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The floor Python, so the interpreter is not a second thing that varies:
  # unpinned, `uv sync` took whatever the runner image carried, and the
  # image's Python moves with the image (review 2026-10-06, CI19).
  # leakcheck.yml pins its Python the same way.
  UV_PYTHON: "3.12"

jobs:
  latest-polars:
    name: build and test against the latest Polars
    if: github.event.schedule != '47 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Same treatment as ci.yml's test job. Without it this job would fail
      # every Monday on `ld terminated with signal 7` -- linking this
      # workspace's ~10 polars-laden test binaries exhausts the runner -- and a
      # canary that cries wolf weekly is worse than no canary, because the
      # signal it exists to carry gets ignored.
      - name: free disk and use a leaner linker
        uses: ./.github/actions/linux-build-prep

      # The Python side only. The wheel carries its own, statically linked
      # copy of polars (`polars = "=0.55.2"` in Cargo.toml) that never meets
      # the user's -- data crosses on the Arrow C Data Interface -- so the
      # Polars release that can break a user is py-polars, and that is the
      # one this job installs. The Rust copy moves by hand: pyo3-polars pins
      # its polars (0.28 wants ^0.55.1) and `crates/online-polars` pins
      # polars-arrow, polars-parquet and polars-utils to the same release, so
      # the `version = "*"` + `cargo update -p polars` this step used to do
      # would have put two polars in the tree the day 0.56 shipped and failed
      # the build for a reason that is not "Polars broke us".
      #
      # The range in pyproject.toml is dropped rather than widened so that a
      # 2.0 is tested the week it appears, not silently excluded by `<2`; the
      # step fails if the line is not where it expects, since a canary that
      # quietly tests the pinned version is worse than none.
      - name: unpin py-polars
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          s, n = re.subn(r'"polars[<>=~!][^"]*"', '"polars"', p.read_text(), count=1)
          assert n == 1, "the polars dependency line moved; fix this unpin"
          p.write_text(s)
          PY

      # Only polars moves; the rest of the lock stays as CI tests it, so the
      # one variable in this run is the Polars release.
      #
      # `--prerelease=allow` is load-bearing: without it uv resolves to the
      # newest *stable* polars, so a release candidate is invisible here. That
      # is not hypothetical -- 2.0.0rc1 shipped on 2026-09-09 and this job
      # would have gone on testing 1.44.x until 2.0 went final, which is the
      # opposite of "a 2.0 is tested the week it appears"
      # (docs/RELEASE-READINESS.md, "Polars 2.0.0rc1, measured").
      - run: uv sync --prerelease=allow --upgrade-package polars
      - name: versions in play
        run: |
          uv run python -c "import polars; print('py-polars', polars.__version__)"
          cargo tree -p polars --depth 0 || true

      # online-py is left out, as in ci.yml's test job, which says why.
      - run: uv run cargo test --workspace --exclude online-py
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      # `-m` replaces the `-m 'not soak'` in pyproject's addopts rather than
      # adding to it, so both go here. `pins` marks the six tests that can
      # pass only on the versions this repo pins: three assert its own polars
      # pins (two in test_scaffold.py, and the VALIDATION.md check, whose
      # header records the polars version), and three measure another
      # library's behaviour on its locked version (polars' multi-key sort, a
      # pyarrow cast bug, duckdb's refusal) -- meaningless unpinned, and the
      # first run of this job was red on exactly one of them.
      - run: uv run pytest -q -m "not soak and not pins"

  next-numpy:
    name: test against NumPy's next release candidate
    if: github.event.schedule != '47 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # NumPy is the one optional dependency (`polars-online[numpy]`,
    # `numpy>=1.26`, no ceiling to drop), and every other job runs on the
    # locked NumPy. Its release candidates allowed and nothing else moved, a
    # red run means NumPy broke this library, a release before it ships (the
    # user, 2026-09-30). The Rust side does not link NumPy, so no cargo tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: free disk and use a leaner linker
        uses: ./.github/actions/linux-build-prep
      - run: uv sync --prerelease=allow --upgrade-package numpy
      - name: versions in play
        run: uv run python -c "import numpy, polars; print('numpy', numpy.__version__, '| py-polars', polars.__version__)"
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      - run: uv run pytest -q -m "not soak and not pins"

  floor-polars:
    name: test against the floor of the Polars range
    if: github.event.schedule == '47 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # release.yml's `floor-polars`, run between releases: the suite on
    # exactly the py-polars the range starts at, and its runtime package,
    # read from pyproject.toml. Only polars moves, down to the floor, and a
    # test that needs a newer polars skips there by version, naming it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: free disk and use a leaner linker
        uses: ./.github/actions/linux-build-prep
      - name: the floor, from pyproject.toml
        id: floor
        run: python3 scripts/polars_floor.py >> "$GITHUB_OUTPUT"
      - run: uv sync --upgrade-package "polars==${{ steps.floor.outputs.version }}" --upgrade-package "polars-runtime-32==${{ steps.floor.outputs.version }}"
      - name: versions in play
        env:
          FLOOR: ${{ steps.floor.outputs.version }}
        run: uv run python -c "import os, polars; print('py-polars', polars.__version__); assert polars.__version__ == os.environ['FLOOR']"
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      - run: uv run pytest -q -m "not soak and not pins"
