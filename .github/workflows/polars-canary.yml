# docs/PLAN.md §10: Polars is pinned, so breakage in a new release is invisible
# until someone upgrades. This job tries the latest Polars on a schedule and
# opens nothing on its own -- a failure here is the notification.
name: Polars canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  latest-polars:
    name: build and test against the latest Polars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7

      - name: unpin polars (Rust and Python)
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          s = p.read_text()
          s = re.sub(r'polars = \{ version = "=[^"]+"', 'polars = { version = "*"', s)
          p.write_text(s)

          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s = re.sub(r'"polars==[^"]+"', '"polars"', s)
          p.write_text(s)
          PY
          cargo update -p polars || true

      - run: uv sync --upgrade
      - name: versions in play
        run: |
          uv run python -c "import polars; print('py-polars', polars.__version__)"
          cargo tree -p polars --depth 0 || true

      - run: uv run cargo test --workspace
      - run: uv run maturin develop --release -m crates/online-py/Cargo.toml
      - run: uv run pytest -q
