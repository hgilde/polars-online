# Actions are pinned to commit SHAs; Dependabot proposes the bumps and CI
# decides whether they are safe. The forwarders' Python dependencies are
# ranges on rheon, which this file leaves alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
