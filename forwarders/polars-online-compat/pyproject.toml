[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "polars-online-compat"
version = "2.0.0"
description = "polars-online-compat is now rheon-compat: this package forwards to it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hans Gilde" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["rheon-compat[polars]>=2.0.0,<3"]

[project.optional-dependencies]
# Only the Gram, correlation and simulation tools need NumPy.
numpy = ["rheon-compat[numpy]"]

[project.urls]
Repository = "https://github.com/rheon-dev/rheon"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_online"]

[tool.hatch.build.targets.sdist]
include = ["src/polars_online", "README.md", "LICENSE"]
