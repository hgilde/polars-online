[package]
name = "online-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming / online regression models. Pure Rust, no Polars dependency."

# Not published to crates.io. The Python wheel is the deliverable, and it is
# built from this workspace by maturin with these as *path* dependencies -- the
# sdist vendors them, so `pip install` from source needs nothing from the
# registry (verified: a clean-venv sdist install compiles and runs). Publishing
# would commit us to a second public API surface for no user-facing gain.
# Revisit for `online-core` alone if it is ever wanted standalone: it has no
# Polars dependency, no `unsafe`, and is exhaustively tested.
publish = false

[lints.rust]
unsafe_code = "forbid"


[dependencies]
faer.workspace = true
# Not used by name: faer's `std` feature less `private-gemm-x86` (the
# workspace Cargo.toml, task 258). All four are faer's own dependencies,
# already linked; nothing new is linked (CLAUDE.md rule 12).
faer-traits.workspace = true
pulp.workspace = true
nano-gemm.workspace = true
libm.workspace = true
# The Gram product's own tiles across threads (`gram_threads`, docs/PLAN.md
# task 225); already linked, through faer and online-polars.
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true

# faer's `std` feature, and with it `private-gemm-x86`, on x86-64 Linux and
# macOS (docs/PLAN.md task 260). That crate's product kernel is the faster
# one there, and the packing buffer it keeps on each thread (twice the L3
# cache) is an address-space reservation, backed only where a product
# touches it. On Windows faer stays without `std` and takes the `gemm`
# crate (the workspace Cargo.toml, task 258): Windows commits the whole
# buffer against the page file, and on Windows the kernel reads its cache
# sizes from CPUID, where an AMD EPYC 7763 virtual machine reports no L3
# and the kernel's products came out wrong (a ridge solve 100 times past
# its rounding bound, every such GitHub runner; task 266). aarch64 takes
# the `gemm` crate too: there the feature would link
# nothing more, but it changes the crate graph, which once moved an
# unrelated loop's code generation by 5%, so aarch64 keeps the build it was
# measured with.
[target.'cfg(all(target_arch = "x86_64", not(windows)))'.dependencies]
faer = { workspace = true, features = ["std"] }

[dev-dependencies]
rmp-serde.workspace = true
proptest.workspace = true
# Tests only: a readable way to feed a config that omits a `#[serde(default)]`
# field, which is what a state file written before that field existed looks like.
serde_json.workspace = true
# Tests only: a state edited in msgpack itself, infinities intact
# (tests/model_contract.rs, states written before the means' low parts).
rmpv.workspace = true

