[package]
name = "online-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming / online regression models. Pure Rust, no Polars dependency."

# Not published to crates.io. The Python wheel is the deliverable, and it is
# built from this workspace by maturin with these as *path* dependencies -- the
# sdist vendors them, so `pip install` from source needs nothing from the
# registry (verified: a clean-venv sdist install compiles and runs). Publishing
# would commit us to a second public API surface for no user-facing gain.
# Revisit for `online-core` alone if it is ever wanted standalone: it has no
# Polars dependency, no `unsafe`, and is exhaustively tested.
publish = false

[lints.rust]
unsafe_code = "forbid"


[dependencies]
faer.workspace = true
# Not used by name: faer's `std` feature less `private-gemm-x86` (the
# workspace Cargo.toml, task 258). All four are faer's own dependencies,
# already linked; nothing new is linked (CLAUDE.md rule 12).
faer-traits.workspace = true
pulp.workspace = true
nano-gemm.workspace = true
libm.workspace = true
# The Gram product's own tiles across threads (`gram_threads`, docs/PLAN.md
# task 225); already linked, through faer and online-polars.
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true

# faer's `std` feature, and with it `private-gemm-x86`, on every x86-64
# build (docs/PLAN.md tasks 260 and 264). That crate's product kernel is the
# faster one, and it keeps a packing buffer of twice the L3 cache on each
# thread that has multiplied: address space reserved on Linux and macOS,
# backed only where a product touches it, but committed whole on Windows,
# where many threads multiplying can exhaust the commit limit (fewer
# threads bound it; PLAN task 263 holds the measured alternatives, none
# chosen). On Windows it reads its cache sizes from CPUID, and where the
# processor reports no L3 (GitHub's EPYC 7763 runners) its products came
# out wrong: a ridge solve 100 times past its rounding bound (tasks 266 and
# 267, the user's choice to keep the kernel for its speed; that test is
# held off Windows). aarch64 has no such kernel; there the feature would link nothing
# more but change the crate graph, which once moved an unrelated loop's
# code generation by 5%, so aarch64 keeps the build it was measured with.
[target.'cfg(target_arch = "x86_64")'.dependencies]
faer = { workspace = true, features = ["std"] }

[dev-dependencies]
rmp-serde.workspace = true
proptest.workspace = true
# Tests only: a readable way to feed a config that omits a `#[serde(default)]`
# field, which is what a state file written before that field existed looks like.
serde_json.workspace = true
# Tests only: a state edited in msgpack itself, infinities intact
# (tests/model_contract.rs, states written before the means' low parts).
rmpv.workspace = true

