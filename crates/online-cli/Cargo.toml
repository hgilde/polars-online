[package]
name = "online-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming runner for online-polars model banks: parquet, ipc, csv or ndjson in and out, TOML config."

# Not published to crates.io. The Python wheel is the deliverable, and it is
# built from this workspace by maturin with these as *path* dependencies -- the
# sdist vendors them, so `pip install` from source needs nothing from the
# registry (verified: a clean-venv sdist install compiles and runs). Publishing
# would commit us to a second public API surface for no user-facing gain.
# Revisit for `online-core` alone if it is ever wanted standalone: it has no
# Polars dependency, no `unsafe`, and is exhaustively tested.
publish = false

[[bin]]
name = "polars-online"
path = "src/main.rs"


[dependencies]
online-polars.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true

# The global allocator (`main.rs`), a statically linked C library on each
# target: jemalloc where py-polars uses it, mimalloc on Windows. On the
# system allocator the binary ran the same bank 1.3x slower a row and 1.8x
# slower a one-row task than the wheel, whose `PolarsAllocator` is jemalloc
# or mimalloc too (review 9, M-5).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
polars = { workspace = true, features = ["parquet", "ipc", "csv", "json", "lazy", "dtype-struct"] }
