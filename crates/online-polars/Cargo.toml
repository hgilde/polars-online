[package]
name = "online-polars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Polars-side plumbing for online-core: chunk-fed model bank over DataFrames."


# Not published to crates.io. The Python wheel is the deliverable, and it is
# built from this workspace by maturin with these as *path* dependencies -- the
# sdist vendors them, so `pip install` from source needs nothing from the
# registry (verified: a clean-venv sdist install compiles and runs). Publishing
# would commit us to a second public API surface for no user-facing gain.
# Revisit for `online-core` alone if it is ever wanted standalone: it has no
# Polars dependency, no `unsafe`, and is exhaustively tested.
publish = false

[dependencies]
online-core.workspace = true
polars = { workspace = true, features = ["lazy", "dtype-struct", "parquet", "ipc", "csv", "json"] }
# Same pin as `polars`; all four are internal polars crates the facade does
# not re-export, and all four are already in `polars`' own tree (nothing new
# is linked): `PlRefPath` for the scans, the IPC field defaults the batched
# IPC writer wants spelled out, the page encoder the runner's parquet writer
# parallelises with (`ParquetSink` in runner.rs), and polars' thread pool
# (`runtime::THREAD_POOL`, sized by `POLARS_MAX_THREADS`), which is where
# that writer's encoding runs -- polars' readers and writers on polars'
# pool, the bank on its own (pool.rs).
polars-arrow = { version = "=0.55.2", default-features = false, features = ["io_ipc"] }
polars-core = { version = "=0.55.2", default-features = false }
polars-parquet = { version = "=0.55.2", default-features = false }
polars-utils = "=0.55.2"
rayon.workspace = true
rmp-serde.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = "1"
toml.workspace = true
