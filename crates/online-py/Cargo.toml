[package]
name = "online-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "pyo3 + pyo3-polars bindings: ModelBank, the runner, and the dormant expression plugin."

# Not published to crates.io. The Python wheel is the deliverable, and it is
# built from this workspace by maturin with these as *path* dependencies -- the
# sdist vendors them, so `pip install` from source needs nothing from the
# registry (verified: a clean-venv sdist install compiles and runs). Publishing
# would commit us to a second public API surface for no user-facing gain.
# Revisit for `online-core` alone if it is ever wanted standalone: it has no
# Polars dependency, no `unsafe`, and is exhaustively tested.
publish = false

[lib]
name = "_polars_online"
crate-type = ["cdylib", "rlib"]

[features]
# The `online` expression namespace -- `pl.col("y").online.<model>(...)`. Off
# by default and not in the wheel: polars hands a stateful user expression its
# whole column in either engine, so that spelling is O(data) where every other
# surface is O(chunk), and two spellings with one set of numbers and two memory
# profiles confused users (docs/PLAN.md section 6). The code stays and the gate
# still compiles it (`--all-features`); `maturin develop --features expr-plugin`
# brings the namespace and its tests back for a re-check.
expr-plugin = ["pyo3-polars/derive", "pyo3-polars/lazy"]

[dependencies]
online-core.workspace = true
online-polars.workspace = true
polars.workspace = true
# `extension-module` is NOT enabled here: it would break plain `cargo build`/`cargo test`
# (no libpython to link against). maturin turns it on via `features` in pyproject.toml.
pyo3 = { workspace = true, features = ["abi3-py312"] }
# `derive` and `lazy` ride on the `expr-plugin` feature: derive turns on
# polars-plan/python, and only polars-lazy/python propagates that to
# polars-mem-engine (otherwise it fails to compile), so they go together.
pyo3-polars = { workspace = true, features = ["dtype-struct"] }
serde.workspace = true
serde_json = "1"
# Names the field a spec failed to parse at ("model.quantile"), not a JSON offset.
serde_path_to_error = "0.1"
