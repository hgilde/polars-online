[workspace]
resolver = "3"
members = [
    "crates/online-core",
    "crates/online-polars",
    "crates/online-cli",
    "crates/online-py",
    # The instruction-count cases behind budgets.toml; ships in nothing.
    "crates/online-bench",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/hgilde/polars-online"

[workspace.dependencies]
online-core = { path = "crates/online-core", version = "1.2.0" }
online-polars = { path = "crates/online-polars", version = "1.2.0" }

# Rust polars is hard-pinned and linked statically into the wheel, so it is
# fixed at build time; py-polars is a runtime range in pyproject.toml
# (>=1.37.0,<3), measured but not locked. The build/dev py-polars is 1.44.2
# (tests/test_scaffold.py BUILT_AGAINST), which rust polars 0.55.2 is the
# engine of; the aligned triple is rust 0.55.2 <-> py-polars 1.44.x <->
# pyo3-polars 0.28.
# "object" is required because pyo3-polars/derive pulls polars-plan, which turns on
# polars-core/object; without it polars-ops fails to compile (non-exhaustive DataType match).
polars = { version = "=0.55.2", default-features = false, features = ["object", "dtype-i8", "dtype-u8", "dtype-i16", "dtype-u16", "dtype-i128", "dtype-decimal", "dtype-array"] }
pyo3 = "0.29"
pyo3-polars = "0.28"

# faer without its `std` feature here, so aarch64 takes the `gemm` crate,
# whose packing is sized to the product and freed after it, beside a
# thread's one L2-sized slab (docs/PLAN.md task 258). `std` also links
# `private-gemm-x86` on x86-64, the faster product kernel, which keeps a
# packing buffer of twice the L3 cache on every thread that has ever
# multiplied (960 MiB a thread on a GitHub Windows runner, committed whole
# by Windows) and takes every product past 16 x 16 x 16 there -- the
# Gram's tiles, and the products inside faer's Cholesky, triangular solves
# and eigensolver. online-core's Cargo.toml turns `std` on for every
# x86-64 build (tasks 260 and 264; the Windows alternatives measured in
# task 263). `rayon`
# keeps `gemm/std`; the four entries after this one turn back on, by Cargo's
# feature unification, the rest of what faer's `std` turns on -- the same
# crates already linked, with the same features as before. `rand` and
# `sparse-linalg` are faer's defaults, unused here but kept: without them
# the crate graph changed enough that a 20-feature `ew_cov`, which runs no
# faer code, ran 5.5% slower on aarch64 (2.02-2.04M rows/s against
# 1.90-1.92M, interleaved; with them 2.02-2.04M, the old build's), so the
# build's code generation, not the product. Only `npy` is dropped, which
# needs `std`.
faer = { version = "0.24", default-features = false, features = ["rayon", "linalg", "rand", "sparse-linalg"] }
faer-traits = { version = "0.24", default-features = false, features = ["std"] }
# faer's x86 product kernel, through its `std` feature: named only for its
# minimum version, the first with the block-size fix (online-core, task 268).
private-gemm-x86 = { version = "0.1.22", default-features = false }
pulp = { version = "0.22", default-features = false, features = ["std"] }
nano-gemm = { version = "0.2", default-features = false, features = ["std"] }
libm = { version = "0.2", default-features = false, features = ["arch"] }
rayon = "1.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: serde_json's default float parser is fast rather than
# correctly rounded and moves a value by an ulp (docs/PLAN.md task 66).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Tests only (docs/PLAN.md task 121): property tests over generated streams
# in `online-core`'s model contract. A dev-dependency links into the test
# binaries alone; hard rule 12 covers what ships, not tests (the user,
# 2026-09-25). Without default features, which fork a process per case.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Tests only: a msgpack value to edit a saved state in the encoding a bank
# writes, where serde_json would turn an infinite parameter into null.
rmpv = "1"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
# Measured on the shipped wheel: 65.2 -> 49.5 MB installed (-24%), download
# 18 -> 17 MB (compression already handles a symbol table well, so the win is
# on disk, which is what matters in a container or a lambda layer).
# `strip = "debuginfo"` was measured too and changes nothing: a release build
# carries no debug info to begin with.
#
# What it costs: `RUST_BACKTRACE=1` frames lose their names. Panic *messages*
# survive -- pyo3 turns a panic into `PanicException` carrying the message
# string, which lives in the binary, not the symbol table -- so the diagnostic
# that names the bug is intact and only the frame list goes.
strip = "symbols"

# The instruction-count cases (crates/online-bench, budgets.toml): release's
# code generation -- thin LTO, one codegen unit -- so a count is of the
# inlining that ships, with the symbol table kept, since Callgrind finds a
# case's entry point by its symbol. Symbols change no instruction.
[profile.bench]
strip = "none"

# The extension for the loop inside a task: `maturin develop --profile
# dev-wheel` (scripts/quick.sh, docs/TESTING.md "Iterating"). The release
# profile above without its two slow parts: thin LTO and one codegen unit
# make the linker and the optimizer see the whole crate graph at once,
# which is what a rebuild after a one-line change spends its minutes on.
# Many codegen units and incremental compilation let a rebuild redo only
# what changed. The optimization level and every setting that decides a
# number (overflow checks and debug assertions off, panics unwinding) are
# release's, so the same tests pass on it bit for bit; it is a dev build
# only, and the shipped wheel, CI and the pre-push gate use `release`.
# `strip = "none"`: the symbols stay, so a backtrace names its frames.
[profile.dev-wheel]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = "none"
