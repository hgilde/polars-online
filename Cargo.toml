[workspace]
resolver = "3"
members = [
    "crates/online-core",
    "crates/online-polars",
    "crates/online-cli",
    "crates/online-py",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hgilde/polars-online"

[workspace.dependencies]
online-core = { path = "crates/online-core", version = "0.2.0" }
online-polars = { path = "crates/online-polars", version = "0.2.0" }

# Polars version is pinned and MUST match the `polars` pin in pyproject.toml.
# rust polars 0.55.2  <->  py-polars 1.44.1  <->  pyo3-polars 0.28
# "object" is required because pyo3-polars/derive pulls polars-plan, which turns on
# polars-core/object; without it polars-ops fails to compile (non-exhaustive DataType match).
polars = { version = "=0.55.2", default-features = false, features = ["object", "dtype-i8", "dtype-u8", "dtype-i16", "dtype-u16", "dtype-i128", "dtype-decimal", "dtype-array"] }
pyo3 = "0.29"
pyo3-polars = "0.28"

faer = "0.24"
rayon = "1.12"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
# Measured on the shipped wheel: 65.2 -> 49.5 MB installed (-24%), download
# 18 -> 17 MB (compression already handles a symbol table well, so the win is
# on disk, which is what matters in a container or a lambda layer).
# `strip = "debuginfo"` was measured too and changes nothing: a release build
# carries no debug info to begin with.
#
# What it costs: `RUST_BACKTRACE=1` frames lose their names. Panic *messages*
# survive -- pyo3 turns a panic into `PanicException` carrying the message
# string, which lives in the binary, not the symbol table -- so the diagnostic
# that names the bug is intact and only the frame list goes.
strip = "symbols"
