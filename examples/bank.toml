# Example model bank for the `online` CLI:
#   cargo run -p online-cli -- --config examples/bank.toml
#
# Generate a matching input with:
#   uv run python scripts/make_example_parquet.py

# Paths in parquet, ipc, csv or ndjson, told from the extension; a path
# that does not say (a `.dat`, a stream) needs `input_format = "ipc"` /
# `output_format = "csv"`, or --input-format / --output-format.
input = "example-input.parquet"
output = "example-output.parquet"
chunk_rows = 50_000
# load_state = "bank.state"     # resume a previous run
save_state = "bank.state"

# EW-ridge over three features, one state per `group`, decayed on a
# seconds-valued clock with a 5-minute cap and a session-boundary gap.
[[specs]]
name = "ridge"
targets = ["y"]
features = ["x0", "x1", "x2"]
clock = "t"
half_life = 600.0
gap_cap = 300.0
session = "session"
session_gap = 1800.0
weight = "w"
group = "group"
min_weight = 20.0
coef_every = 1000

[specs.model]
type = "ew_ridge"
ridge = [1e-6, 0.1]
standardize = true

# The same stream through a Kalman filter, coefficients drifting with a
# 1-hour half-life.
[[specs]]
name = "kalman"
targets = ["y"]
features = ["x0", "x1", "x2"]
clock = "t"
half_life = 600.0
gap_cap = 300.0
group = "group"
min_weight = 20.0

[specs.model]
type = "kalman"
coef_half_life = 3600.0
# revert_half_life = ["inf", 7200.0, 7200.0, 7200.0]  # slopes revert toward zero; intercept stays a random walk

# Which of the two is closer, row by row: a sequential test on the sign of
# `|resid_kalman| - |resid_ridge|`, anytime-valid at every row
# (`exp(log_e_a) >= 20` is evidence for the ridge at the 5% level). The
# target names the residual field of both sides, `resid_y`; the ridge is a
# grid, so `a_suffix` picks its instance (`resid_y__r0.000001`). A mismatch
# is refused with the residual fields each side has; `--dry-run` lists
# them. The bank runs the two sides first.
[[specs]]
name = "ridge_vs_kalman"
targets = ["y"]
features = []
clock = "t"
gap_cap = 300.0
group = "group"

[specs.model]
type = "seqtest"
a = "ridge"
a_suffix = "__r0.000001"
b = "kalman"
