function = "CorrChange::long_run_sd"
mutation = "replace && with ||"
line_has = "if !(sx2 > 0.0 && sy2 > 0.0) {"
why = """as above: with one column without spread the guard no longer \
fires, and the zero standard deviation makes `ρ̂` and every `ξ` NaN"""

