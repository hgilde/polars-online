[[equivalent]]
file = "crates/online-core/src/lasso.rs"
function = "<impl OnlineModel for Lasso>::step"
mutation = "replace != with =="
line_has = "if self.zbuf.len() != self.cfg.k_total() {"
why = """`new` and `restore` both size the buffer at `k_total`, so the branch \
never runs; the mutant reallocates it every row instead, and the row \
overwrites every entry before anything reads it"""
