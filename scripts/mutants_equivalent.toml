# added in `held_median_tests.rs`, `huber_refit.rs`, `margbins.rs`,
# `marginal/refit_tests.rs`, `robust/refit_tests.rs` and
# `sgd/refit_tests.rs`. The treap's priority hash only shapes the tree,
# which no read or insert result depends on (every rotation keeps the
# order by `(|e|, seq)`); its mutants that would make a read `O(n)` -- a
# constant priority, one following the arrival order, no rotation -- are
# caught by `the_tree_stays_logarithmic_in_any_arrival_order`, and those
# listed here left the tree as shallow as the hash does (4,096 rows rising,
# falling, repeated and random: deepest 25 to 32, mean depth 13.5 to 16.5,
# against 32 and 16.5 unmutated; a list is 4,096 deep).

[[equivalent]]
file = "crates/online-core/src/held_median.rs"
function = "priority"
mutation = "replace >> with <<"
line_has = "z = (z ^ (z >> 30)).wrapping_mul(0xbf58_476d_1ce4_e5b9);"
why = """the priority only shapes the treap: every read and insert gives the \
same values on any tree ordered by `(|e|, seq)`, and the mutated hash still \
mixes `seq` (an odd multiply and a later xor-shift follow), so the tree \
stays logarithmic: deepest 30, mean depth 15.0 on 4,096 sorted rows"""

