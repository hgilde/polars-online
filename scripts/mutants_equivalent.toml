[[equivalent]]
file = "crates/online-core/src/lasso.rs"
function = "Lasso::standardized"
mutation = "replace > with >="
line_has = "c[i * k + j] = if s[i] > 0.0 && s[j] > 0.0 {"
why = """on the first operand only: it lets a NaN into the row of a feature \
