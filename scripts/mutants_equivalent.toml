# Mutants no test can catch: on every input the code can receive, the mutated
# line computes what the original does. scripts/mutants_report.py leaves them
# out of the survivors it reports and fails on.
#
# Each entry names the file, the function, the mutation as cargo-mutants
# spells it, and code the mutated line must contain. So an entry follows its
# line when code above it moves, and lapses when the line itself changes;
# tests/test_mutants_report.py checks that every entry still finds its line.
# Add one only with the reason no input can tell the two apart
# (docs/TESTING.md, "Mutation survivors").

[[equivalent]]
file = "crates/online-core/src/stats.rs"
function = "P2Quantile::adjust"
mutation = "replace > with >="
line_has = "} else if d_sign > 0.0 {"
why = "d_sign is +1 or -1 by construction, so > 0 and >= 0 agree on every value it takes"

[[equivalent]]
file = "crates/online-core/src/stats.rs"
function = "P2Quantile::adjust"
mutation = "replace < with <="
line_has = "self.q[i] = if qm < parabolic && parabolic < qp {"
why = """the two differ only when the parabolic prediction lands exactly on a \
neighbouring marker. When that marker is one position away, the linear \
fallback then gives the same height; otherwise it takes an exact \
floating-point coincidence, which no input can be built to reach"""

[[equivalent]]
file = "crates/online-core/src/stats.rs"
function = "SlotMetrics::update"
mutation = "replace > with >="
line_has = "if denom > 0.0 {"
why = "a scored row has w > 0, so denom = lam * W + w is positive and the branch is always taken"

[[equivalent]]
file = "crates/online-polars/src/span.rs"
function = "format_duration"
mutation = "replace < with <="
line_has = "    if ns < 0 {"
why = "ns == 0 returns \"0s\" two lines earlier, so ns < 0 and ns <= 0 agree wherever the line runs"

[[equivalent]]
file = "crates/online-core/src/ewdiag.rs"
function = "EwDiag::update"
mutation = "replace + with -"
line_has = "*ci = a * *ci + a * b * d * d;"
why = """this is the branch a row of weight 0 takes, where b is 0: the term is \
0 for every finite deviation, and the inputs are bounded, so a·c + 0 and \
a·c − 0 are the same double"""

[[equivalent]]
file = "crates/online-core/src/ewcov.rs"
function = "EwCov::skip"
mutation = "replace * with /"
line_has = "if self.pending.block_rows > 0 && lam * self.w_sum > 0.0 {"
why = """lam / w_sum > 0 and lam * w_sum > 0 agree wherever w_sum > 0; at \
w_sum = 0 the buffer refuses a row that leaves no weight and the decay has \
nothing to age, the same empty state either way"""

[[equivalent]]
file = "crates/online-core/src/gaps.rs"
function = "Cross::miss"
mutation = "replace > with >="
line_has = "if b > 0.0 {"
why = """at b = 0 the offset takes 0·(z − m) away, which is 0 for every \
finite z, and features reach the accumulator bounded (INPUT_BOUND)"""

[[equivalent]]
file = "crates/online-core/src/corrchange.rs"
function = "CorrChange::long_run_sd"
mutation = "replace > with >="
line_has = "if !(sx2 > 0.0 && sy2 > 0.0) {"
why = """the guard returns NaN for a column without spread; let through, a \
zero variance divides 0 by 0 in `ρ̂` and the result is NaN by the same \
route (`a_constant_column_has_no_long_run_sd` holds either way)"""

[[equivalent]]
file = "crates/online-core/src/corrchange.rs"
function = "CorrChange::long_run_sd"
mutation = "replace && with ||"
line_has = "if !(sx2 > 0.0 && sy2 > 0.0) {"
why = """as above: with one column without spread the guard no longer \
fires, and the zero standard deviation makes `ρ̂` and every `ξ` NaN"""

[[equivalent]]
file = "crates/online-core/src/lasso.rs"
function = "<impl OnlineModel for Lasso>::step"
mutation = "replace < with <="
line_has = "if err[li] < err[best] {"
why = """a strict or a loose minimum over the path's errors differ only on an exact tie, two points of the path with the same error to the bit, which outside identical fits has no measure; the oracles score every stream with distinct errors"""

[[equivalent]]
file = "crates/online-core/src/cluster/summary.rs"
function = "FeatureMoments::step_long"
mutation = "replace > with >="
line_has = "let d = if cap > 0.0 && d * d > cap {"
why = """the first `>`: `cap` is 0 only where the reference's variance is 0, \
and a deviation from a reference without spread starts it over before this \
line, so here `cap = 0` comes with `d = 0`, which no clip changes; the \
second: at `d² = cap` exactly both branches give `±√(d²)`, and `√(fl(d²)) = \
|d|` for every double that neither overflows nor underflows"""

[[equivalent]]
file = "crates/online-core/src/ewcov.rs"
function = "EwCov::update"
mutation = "replace > with >="
line_has = "if w > 0.0 && w > crate::window::EMPTY_FRACTION * (lam * self.w_sum) {"
why = """the first `>`: a row of weight 0 passes `w >= 0` and fails the \
fraction test after it (`0 > EMPTY_FRACTION · lam · w_sum` for any weight), \
so it is not counted either way; the second `>` is caught (the row at the \
fraction exactly)"""

[[equivalent]]
file = "crates/online-core/src/marginal.rs"
function = "Marginal::learn"
mutation = "replace > with >="
line_has = "if w > 0.0 && w > crate::window::EMPTY_FRACTION * (lam * self.wt[t]) {"
why = """as `EwCov::update`'s: a row of weight 0 fails the fraction test \
after `w >= 0`, so it is not counted either way; the second `>` is caught"""

[[equivalent]]
file = "crates/online-core/src/cluster/summary.rs"
function = "FeatureMoments::metric"
mutation = "replace > with >="
line_has = "let v = if floor > v { floor } else { v };"
why = """at `floor = v` both branches are the same double; neither is NaN \
(`scale_floor` is refused unless finite, and both variances are finite)"""
