line_has = "if crate::variance_is_usable(v, acc.raw(i + off, i + off)) {"
why = """both mutants are inside the second argument, which \
`variance_is_usable` ignores; `acc.raw(i * off, ..)` is still in range"""

[[equivalent]]
file = "crates/online-core/src/lasso.rs"
function = "Lasso::solve"
mutation = "replace > with >="
line_has = "if s[i] > 0.0 && p.is_finite() {"
