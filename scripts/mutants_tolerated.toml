# Survivors kept on purpose: a test could tell each from the original, but
# only by a difference no caller can act on, or only where no test build can
# go. scripts/mutants_report.py shows them apart from the survivors and fails
# on none of them (task 158).
#
# An entry matches as an equivalent does (scripts/mutants_equivalent.toml):
# by file, function, the mutation as cargo-mutants spells it, and code the
# mutated line must contain. `columns`, where given, are the columns the
# mutation may sit at, for a line holding the same operator at a column a
# test does catch; a `line_has` over two lines takes in the line before,
# for a line whose twin in the same function a test does catch. `kind` says why the survivor is kept:
#
#   rounding     the two differ only in a result's last bits
#   below-error  the two differ by less than the computation's own error:
#                its grid's, or its stopping tolerance
#   tie          the two part only at an exact equality of two continuous
#                statistics, which no input can be built to reach
#   test-build   the line runs only after a debug_assert! has failed, which
#                no test build gets past
#   input-bound  the two part only past the documented input bound
#   slow         the line runs only where one call costs about 30 s in a
#                debug build, too slow for the suite
#
# tests/test_mutants_report.py checks every entry still finds its line. Add
# one only with the measured size of the difference.

[[tolerated]]
file = "crates/online-core/src/boundary.rs"
function = "boundary_cdf"
mutation = "replace / with *"
line_has = "let spread = (1.0 / (2.0 * c * c * kappa)).sqrt();"
kind = "below-error"
why = """`spread` only sets `t_end`, where the solve stops. Stopped earlier or \
later once the absorbed mass has settled, the cdf moves by under 1e-7, most \
by under 1e-13, where the solve's own grid error is 3e-5 to 4e-5 \
(`the_solve_is_a_second_computation_of_the_law`)"""

