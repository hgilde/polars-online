# The oracle ledger: each case's error against its oracle, which only
# tightens (docs/TESTING.md, "The oracle ledger"; scripts/oracles.py).
#
# The heavy grids against a third-party oracle (`pytest -m oracle_grid`) run
# on CI, not in the gate. Each case here is one quantity a grid bounds,
# recorded by `ledger.record` in the test (tests/ledger.py): the value of the
# worst seed and of the seed at the nearest-rank 95th percentile, both in
# the test's own units, judged by their gap from `ideal` (0 for an error, 1
# for a score such as an ARI, a share or an F1). Each group names the tests
# that record it, the oracle libraries whose answer it takes as given at the
# versions it was measured on, and its dataset.
#
# - A gap past the ledger's by more than the tolerance fails. Find what moved
#   it. If that is the price of a change worth having, raise the number with
#   a [[raised]] entry at the end of this file (the key, the old and new
#   value, the date, the reason) and a `changelog` text the CHANGELOG
#   contains; `scripts/oracles.py raises` holds every increase in this
#   file's git history to both. A wider tolerance or floor is a raise too.
# - A gap under the ledger's by more than the tolerance fails as well,
#   naming the number to tighten to, so the change that made the gain keeps
#   it (`scripts/oracles.py apply` on the run's measured.json writes it).
# - An oracle library whose version moved fails until `apply` records the
#   version the numbers held on.
# - A case with no numbers yet is reported and fails nothing.
#
# `floor` on a case is a gap below which differences are round-off: a gap
# under it counts as it. oracle_hashes.toml, beside this file, holds the
# hash of this library's outputs on each group's inputs, which the gate
# checks in seconds; `uv run python scripts/oracles.py rerun` re-runs the
# groups whose hashes moved and records both files.

[meta]
# A share of a case's gap. The grids are deterministic, so a run on one
# platform reads the same numbers every time; what 2% absorbs is another
# platform's last bits in a statistical case. A count is held exactly.
tolerance = 0.02
# Where the numbers were measured (`rerun`, on a developer's Mac). CI's
# Oracles workflow checks them on linux-x86_64; a case another platform
# reads past the tolerance is raised with that reason, or the ledger is
# re-based on CI's measured.json and this names its platform.
platform = "darwin-arm64"

