[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "polars-online"
version = "0.7.0"
description = "Streaming / online regression models for Polars"
readme = "README.md"
license = "Apache-2.0"
# PEP 639. Without this the sdist ships without a licence file at all, which
# Apache-2.0 requires a distribution to carry, and which packagers check for.
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hans Gilde" }]
keywords = ["polars", "online-learning", "streaming", "regression", "time-series", "kalman", "ewma"]
# No License :: classifier -- PEP 639: `license` above is the SPDX expression,
# and mixing the two is deprecated.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    # A *range*, not the exact pin this used to be. The Rust side still pins
    # `polars = "=0.55.2"` in Cargo.toml, and the wheel links it statically --
    # but that copy never meets the user's. Data crosses on the Arrow C Data
    # Interface, so the two are independent, and an exact pin here only blocked
    # dependency resolution for anyone who wanted a different polars.
    #
    # The floor is measured, not guessed. `ModelBank` alone works from 1.28.1
    # (1.28.0 and below fail on `PySeries._export` with a clean AttributeError);
    # `ModelBank.fit(lf)`, `fit_predict_batches(lf)` and `lf.online.fit_predict`
    # read with `LazyFrame.collect_batches`, which py-polars added in 1.34.0,
    # and that is the floor. The whole suite passes on 1.34.0, 1.38.1 and 1.44.1 with
    # identical numbers. `docs/RELEASE-READINESS.md` has the matrix and the
    # command to reproduce it.
    #
    # The ceiling was `<2` and was raised to `<3` for 0.5.1, deliberately and
    # on measurement rather than on 2.x keeping the interface: the whole
    # suite passes on 2.0.0rc1 with the same numbers as on 1.44, all three
    # interfaces work, and `LazyFrame.collect_batches` -- the floor -- is
    # unchanged (`docs/RELEASE-READINESS.md`). It is still a bet on the rest
    # of 2.x, hedged two ways: `polars-canary.yml` runs the suite against the
    # latest polars weekly, and `release.yml` runs it again at the tag on the
    # newest version this range admits, blocking. It was hedged three ways
    # until task 85: the expression plugin's ABI was version-negotiated and
    # refused to load rather than misbehave, and that hedge went with it.
    "polars>=1.34.0,<3",
]

# Only `ModelBank.gram()` and the `po.gram`, `po.corr` and `po.sim` toolkits
# need numpy, so it is an extra rather than a dependency: polars does not
# require numpy, and a few optional accessors are no reason to put it on every
# install.
[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/hgilde/polars-online"
Documentation = "https://hgilde.github.io/polars-online/"
Changelog = "https://github.com/hgilde/polars-online/blob/main/CHANGELOG.md"
Issues = "https://github.com/hgilde/polars-online/issues"

[tool.maturin]
manifest-path = "crates/online-py/Cargo.toml"
module-name = "polars_online._polars_online"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "hypothesis>=6.167.0",
    "maturin>=1.15,<2.0",
    "numpy>=2.5.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    # tests/test_ffi_memory.py reads RSS to detect FFI leaks. One dependency
    # beats three hand-rolled platform branches that could each be wrong.
    "psutil>=5.9",
    # For tests/test_ci_cost_policy.py: the workflows are parsed and asserted
    # on, so the policy that bounds the CI bill is enforced, not just commented.
    "pyyaml>=6.0",
    "river>=0.26.1",
    # Second opinions for the code review of 2026-09-12
    # (tests/test_second_opinion.py, docs/REVIEW-2026-09-12-PROGRESS.md):
    # statsmodels for Holt / exponential smoothing, the autocorrelation and
    # the HAC variance; filterpy for the Kalman filter; and
    # bayesian-changepoint-detection for Adams & MacKay's run-length
    # recursion. Every test that uses one imports it with
    # `pytest.importorskip`, so none is needed to run the rest. statsmodels
    # brings pandas with it; the tests do not use pandas themselves.
    "statsmodels>=0.15",
    "filterpy>=1.4.5",
    "bayesian-changepoint-detection>=0.2.dev1",
    "ruff>=0.14",
    # The package is typed (py.typed, the pyo3 stub, PEP 692 kwargs); mypy in
    # the gate is what keeps that true. Pure Python, seconds to run.
    "mypy>=1.14",
    # tests/test_consumed_source.py reproduces the spent-stream hazard on a
    # real relation rather than a stand-in, and pins what DuckDB issue #17084
    # actually does on the installed version. Dev only: the package keeps its
    # single `polars` dependency, and every duckdb test is `importorskip`ed,
    # so none of this is needed to run the suite.
    "duckdb>=1.5.5",
]
# The API reference: Sphinx over the docstrings, which are written in its
# dialect (``:class:`` roles, ``::`` literal blocks). Its own group, so a
# plain `uv sync` stays lean; the gate and CI build it with
# `uv run --group docs sphinx-build -W docs/reference docs/_build/html`.
docs = [
    "sphinx>=8.2",
    "furo>=2024.8",
]

[tool.mypy]
# The package only: it must type-check against its own stub with nothing
# built, which is how the lint job runs it. Tests are deliberately untyped.
files = ["python/polars_online"]
mypy_path = "python"
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Soak tests are opt-in: `uv run pytest -m soak`.
addopts = "-ra -m 'not soak'"
markers = [
    "soak: long-running stability tests (millions of rows)",
    "pins: tests that can only pass on the polars this repo pins -- assertions about the pins themselves, and docs that record the version they were generated with; the canary unpins on purpose and runs `-m 'not soak and not pins'`",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.format]
# ruff also formats Python inside Markdown fences. Documentation examples are
# laid out for reading (aligned comments, grouped keyword arguments), so the
# formatter does not own them; `ruff check` still lints them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["polars_online"]
