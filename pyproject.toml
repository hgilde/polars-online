[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "polars-online"
version = "0.1.0"
description = "Streaming / online regression models for Polars"
readme = "README.md"
license = "Apache-2.0"
# PEP 639. Without this the sdist ships without a licence file at all, which
# Apache-2.0 requires a distribution to carry, and which packagers check for.
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hans Gilde" }]
keywords = ["polars", "online-learning", "streaming", "regression", "time-series", "kalman", "ewma"]
# No License :: classifier -- PEP 639: `license` above is the SPDX expression,
# and mixing the two is deprecated.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    # A *range*, not the exact pin this used to be. The Rust side still pins
    # `polars = "=0.55.2"` in Cargo.toml, and the wheel links it statically --
    # but that copy never meets the user's. Data crosses on the Arrow C Data
    # Interface, so the two are independent, and an exact pin here only blocked
    # dependency resolution for anyone who wanted a different polars.
    #
    # The floor is measured, not guessed. `ModelBank` (and the dormant
    # expression plugin, `--features expr-plugin`) work from 1.28.1 (1.28.0 and
    # below fail on `PySeries._export` with a clean AttributeError, and 1.26.0
    # additionally refuses to load the plugin);
    # `po.run` over a path or a plan and `lf.online.fit_predict` read with
    # `LazyFrame.collect_batches`, which py-polars added in 1.34.0, and that
    # is the floor. The whole suite passes on 1.34.0, 1.38.1 and 1.44.1 with
    # identical numbers. `docs/RELEASE-READINESS.md` has the matrix and the
    # command to reproduce it.
    #
    # The ceiling is a bet that 1.x keeps the interface, hedged by
    # `polars-canary.yml`, which runs the suite against the latest polars
    # weekly. (The plugin ABI is version-negotiated too, but the plugin no
    # longer ships -- docs/PLAN.md section 6.)
    "polars>=1.34.0,<2",
]

# `gram()` is the only thing that needs numpy, so it is an extra rather than a
# dependency: polars does not require numpy, and one optional accessor is no
# reason to put it on every install.
[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/hgilde/polars-online"
Changelog = "https://github.com/hgilde/polars-online/blob/main/CHANGELOG.md"
Issues = "https://github.com/hgilde/polars-online/issues"

[tool.maturin]
manifest-path = "crates/online-py/Cargo.toml"
module-name = "polars_online._polars_online"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "hypothesis>=6.167.0",
    "maturin>=1.15,<2.0",
    "numpy>=2.5.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    # tests/test_ffi_memory.py reads RSS to detect FFI leaks. One dependency
    # beats three hand-rolled platform branches that could each be wrong.
    "psutil>=5.9",
    # For tests/test_ci_cost_policy.py: the workflows are parsed and asserted
    # on, so the policy that bounds the CI bill is enforced, not just commented.
    "pyyaml>=6.0",
    "river>=0.26.1",
    "ruff>=0.14",
    # The package is typed (py.typed, the pyo3 stub, PEP 692 kwargs); mypy in
    # the gate is what keeps that true. Pure Python, seconds to run.
    "mypy>=1.14",
]

[tool.mypy]
# The package only: it must type-check against its own stub with nothing
# built, which is how the lint job runs it. Tests are deliberately untyped.
files = ["python/polars_online"]
mypy_path = "python"
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Soak tests are opt-in: `uv run pytest -m soak`.
addopts = "-ra -m 'not soak'"
markers = ["soak: long-running stability tests (millions of rows)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.format]
# ruff also formats Python inside Markdown fences. Documentation examples are
# laid out for reading (aligned comments, grouped keyword arguments), so the
# formatter does not own them; `ruff check` still lints them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["polars_online"]
