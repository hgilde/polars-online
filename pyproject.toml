[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "polars-online"
version = "0.13.0"
description = "Streaming / online regression models for Polars"
readme = "README.md"
license = "Apache-2.0"
# PEP 639. Without this the sdist ships without a licence file at all, which
# Apache-2.0 requires a distribution to carry, and which packagers check for.
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Hans Gilde" }]
keywords = ["polars", "online-learning", "streaming", "regression", "time-series", "kalman", "ewma"]
# No License :: classifier -- PEP 639: `license` above is the SPDX expression,
# and mixing the two is deprecated.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    # A *range*, not the exact pin this used to be. The Rust side still pins
    # `polars = "=0.55.2"` in Cargo.toml, and the wheel links it statically --
    # but that copy never meets the user's. Data crosses on the Arrow C Data
    # Interface, so the two are independent, and an exact pin here only blocked
    # dependency resolution for anyone who wanted a different polars.
    #
    # The floor is measured, not guessed. `ModelBank` alone works from 1.28.1
    # (1.28.0 and below fail on `PySeries._export` with a clean AttributeError);
    # `ModelBank.fit(lf)`, `fit_predict_batches(lf)` and `lf.online.fit_predict`
    # read with `LazyFrame.collect_batches`, which py-polars added in 1.34.0,
    # and that is the floor. The whole suite passes on 1.34.0, 1.38.1 and 1.44.1 with
    # identical numbers. `docs/RELEASE-READINESS.md` has the matrix and the
    # command to reproduce it.
    #
    # The ceiling was `<2` and was raised to `<3` for 0.5.1, deliberately and
    # on measurement rather than on 2.x keeping the interface: the whole
    # suite passes on 2.0.0rc1 with the same numbers as on 1.44, all three
    # interfaces work, and `LazyFrame.collect_batches` -- the floor -- is
    # unchanged (`docs/RELEASE-READINESS.md`). It is still a bet on the rest
    # of 2.x, hedged two ways: `polars-canary.yml` runs the suite against the
    # latest polars weekly, and `release.yml` runs it again before every
    # upload, on the newest version this range admits, blocking. It was
    # hedged three ways until task 85: the expression plugin's ABI was
    # version-negotiated and refused to load rather than misbehave, and that
    # hedge went with it.
    "polars>=1.34.0,<3",
]

# Only `ModelBank.gram()` and the `po.gram`, `po.corr` and `po.sim` toolkits
# need numpy, so it is an extra rather than a dependency: polars does not
# require numpy, and a few optional accessors are no reason to put it on every
# install. The floor is NumPy's first release with wheels for Python 3.12,
# the oldest Python this package supports (review 2026-10-06, CI10).
[project.optional-dependencies]
numpy = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/hgilde/polars-online"
Documentation = "https://hgilde.github.io/polars-online/"
Changelog = "https://github.com/hgilde/polars-online/blob/main/CHANGELOG.md"
Issues = "https://github.com/hgilde/polars-online/issues"

[tool.maturin]
manifest-path = "crates/online-py/Cargo.toml"
module-name = "polars_online._polars_online"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
# The package depends on polars alone. A test may use any other library it
# needs -- an oracle, a second opinion, or interop with that library -- and
# declares it here by name, never in `dependencies` above. docs/TESTING.md,
# "Libraries the package does not depend on", has the rules, and
# tests/test_dependency_policy.py checks them.
dev = [
    "hypothesis>=6.167.0",
    "maturin>=1.15,<2.0",
    "numpy>=2.5.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    # tests/test_ffi_memory.py reads RSS to detect FFI leaks. One dependency
    # beats three hand-rolled platform branches that could each be wrong.
    "psutil>=5.9",
    # For tests/test_ci_cost_policy.py: the workflows are parsed and asserted
    # on, so the policy that bounds the CI bill is enforced, not just commented.
    "pyyaml>=6.0",
    "river>=0.26.1",
    # Second opinions for the code review of 2026-09-12
    # (tests/test_second_opinion.py, docs/REVIEW-2026-09-12-PROGRESS.md):
    # statsmodels for Holt / exponential smoothing, the autocorrelation and
    # the HAC variance; filterpy for the Kalman filter; and
    # bayesian-changepoint-detection for Adams & MacKay's run-length
    # recursion.
    "statsmodels>=0.15",
    "filterpy>=1.4.5",
    "bayesian-changepoint-detection>=0.2.dev1",
    # Oracles the tests import themselves, so declared by name rather than
    # reached through statsmodels: pandas' `ewm(times=)` for the temporal
    # clock, and scipy's distributions for the Gaussian classes and the
    # Mahalanobis distance. The floors are the versions measured.
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "ruff>=0.14",
    # The package is typed (py.typed, the pyo3 stub, PEP 692 kwargs); mypy in
    # the gate is what keeps that true. Pure Python, seconds to run.
    "mypy>=1.14",
    # tests/test_consumed_source.py reproduces the spent-stream hazard on a
    # real relation rather than a stand-in, and pins what DuckDB issue #17084
    # actually does on the installed version. Dev only: the package keeps its
    # single `polars` dependency.
    "duckdb>=1.5.5",
    # examples/adbc_cursors.py: ADBC is one driver manager in front of most
    # warehouses (docs/ARROW-SOURCES.md §2), and the one-cursor-per-plan rule
    # the example shows fails *silently* when broken, so the example must run.
    # The SQLite driver needs no server. The floors are the versions measured,
    # and neither package pulls in pyarrow. Dev only, like duckdb: the package
    # keeps its single `polars` dependency.
    "adbc-driver-manager>=1.12.0",
    "adbc-driver-sqlite>=1.12.0",
    # tests/test_pyarrow_interop.py: pyarrow, the reference Arrow
    # implementation, reading a bank's Arrow output and streaming into a bank
    # through a reader, which the README and the docstrings say it does. Test
    # only: the package keeps its single `polars` dependency, and
    # tests/conftest.py makes pyarrow unimportable in the rest of the suite,
    # which so runs as a user without it does. The floor is the version measured.
    "pyarrow>=25.0.1",
    # Second opinions under an open-source licence (task 121, BSD-3-Clause):
    # HuberRegressor and LinearRegression for `huber` (the review's T-S4),
    # DecisionTreeRegressor for `marginal`'s split (T-S12), and SGDRegressor
    # for `sgd`, compared live where the tests quoted it. The floor is the
    # version measured.
    "scikit-learn>=1.9.1",
    # A second FTRL-proximal beside river's (docs/PLAN.md task 115): Vowpal
    # Wabbit's `--ftrl`, held to `ftrl` row by row in
    # tests/test_second_opinion.py, with what river's comparison does not
    # reach: the squared loss, row weights, the intercept and the model's
    # own predictions. BSD-3-Clause, no dependencies, and wheels for every
    # Python and OS that CI runs. The floor is the version measured.
    "vowpalwabbit>=9.11.9",
    # Second opinions for settings a self-referential oracle alone held
    # (review 2026-10-06, TA4): hmmlearn's GaussianHMM (BSD-3-Clause) for
    # `hmm`'s filter at fixed parameters, and padasip's FilterRLS (MIT) for
    # `rls`. hmmlearn publishes wheels up to CPython 3.13; on 3.14 uv builds
    # its sdist, a small C++ extension that every platform this repo builds
    # on compiles. padasip is pure Python. The floors are the versions
    # measured.
    "hmmlearn>=0.3.3",
    "padasip>=1.2.2",
    # scripts/doc_structure.py, WRITING's step-5 checks, run by
    # tests/test_doc_structure.py: a CommonMark parser with GitHub's tables
    # reads lists, code blocks and HTML as GitHub does, where a hand-rolled
    # reader took eleven indented tables for tables that GitHub shows as
    # code. MIT. The floor is the version measured.
    "markdown-it-py>=4.2.0",
]
# The API reference: Sphinx over the docstrings, which are written in its
# dialect (``:class:`` roles, ``::`` literal blocks). Its own group, so a
# plain `uv sync` stays lean; the gate and CI build it with
# `uv run --group docs sphinx-build -W docs/reference docs/_build/html`.
docs = [
    "sphinx>=8.2",
    "furo>=2024.8",
]

[tool.uv]
# Both groups on every `uv sync`, so every environment a test runs in holds
# every library tests/test_dependency_policy.py reads the licence of. With
# `dev` alone, CI's test jobs lacked sphinx and the licence check failed
# there, while the gate, whose Sphinx step installs `docs`, passed (the
# 0.11.0 tag's first run).
default-groups = ["dev", "docs"]

[tool.mypy]
# The package only: it must type-check against its own stub with nothing
# built, which is how the lint job runs it. Tests are deliberately untyped.
files = ["python/polars_online"]
mypy_path = "python"
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Soak tests are opt-in: `uv run pytest -m soak`.
addopts = "-ra -m 'not soak'"
markers = [
    "soak: long-running stability tests (millions of rows)",
    "pins: tests that can only pass on the versions this repo pins -- assertions about the pins themselves, docs that record the version they were generated with, and another library's current behaviour measured on its locked version (polars' multi-key sort, a pyarrow cast bug, duckdb's refusal); the canary unpins on purpose and runs `-m 'not soak and not pins'`",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.format]
# ruff also formats Python inside Markdown fences. Documentation examples are
# laid out for reading (aligned comments, grouped keyword arguments), so the
# formatter does not own them; `ruff check` still lints them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["polars_online"]
